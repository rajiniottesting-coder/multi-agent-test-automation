# Throw-away validation workflow (removed in a later cycle): its scheduled job
# fails on purpose (E27b); run by hand it runs the inventory tools (R9).
name: zz Validation A (throw-away)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  failing:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Fail on purpose (validation E27b)
        run: |
          echo "throw-away scheduled failure"
          exit 1

  inventory-tools:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install Playwright browsers
        run: playwright install --with-deps chromium
      - name: check_inventory_staleness --compare
        run: python -m scripts.check_inventory_staleness --compare || echo "exit $?"
      - name: check_inventory_staleness --propose
        run: |
          mkdir -p reports
          python -m scripts.check_inventory_staleness --propose reports/proposals.json || echo "exit $?"
          ls -la reports/proposals.json
      - name: apply_inventory_proposals --dry-run
        run: |
          sha_before=$(sha256sum app_inventory/*.json)
          python -m scripts.apply_inventory_proposals reports/proposals.json --dry-run || echo "exit $?"
          [ "$sha_before" = "$(sha256sum app_inventory/*.json)" ] && echo "dry-run wrote nothing"
      - name: onboarding_check
        run: python -m scripts.onboarding_check || echo "exit $?"
