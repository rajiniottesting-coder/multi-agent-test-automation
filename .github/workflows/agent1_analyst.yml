# ─────────────────────────────────────────────────────────────
# Agent 1 (Analyst) — manual + scheduled trigger
#
# WHEN THIS RUNS:
#   1. Manually triggered from GitHub Actions UI (workflow_dispatch)
#      - Optional inputs: process a single story or scan all `ai-ready`
#   2. Automatically on a business-hours cron schedule:
#      - Every 30 minutes, Mon-Fri 04:30-13:30 UTC
#      - Calls `--scan` to find stories matching config.yaml selection
#      - Skips weekends/nights to avoid idle CI minutes outside work hours
#
# WHAT IT DOES:
#   For each Story with label `ai-ready` (and not `ai-processed` or
#   `ai-skip`), Agent 1 calls the LLM to draft Jira Test Case issues
#   (typically 3-7 per story), links them to the parent Story, and
#   adds the `ai-processed` label so the next scan skips it.
#
# COST PROFILE:
#   - Idle scan (no matching stories): ~30-40 sec runner time, $0 LLM
#   - Per processed story: varies by LLM provider
#   - max_stories_per_run is capped at 2 in config.yaml for safety
#
# WHY BUSINESS HOURS ONLY:
#   24/7 cron at */15 would consume ~3,800 idle runner minutes/month
#   on top of the GitHub free-tier 2,000-minute allowance for private
#   repos. Restricting to weekday business hours cuts that ~75% to
#   ~960 idle minutes — well within free tier. If you need after-hours
#   processing, expand the cron range or trigger manually.
#
# REQUIRED REPO SECRETS:
#   - OPENAI_API_KEY  (LLM API key / bearer token)
#   - JIRA_URL, JIRA_EMAIL, JIRA_API_TOKEN, JIRA_PROJECT_KEY
#
# REQUIRED REPO VARIABLES (Settings -> Secrets and variables -> Variables):
#   - OPENAI_API_BASE  (LLM API base URL)
#   - LLM_MODEL        (e.g., claude-opus-4-6, gpt-4o)
#   - LLM_MODEL_LIGHT  (optional) cheaper model for Agents 1 & 5 only.
#                      Agents 2 & 3 always use LLM_MODEL.
#
# NOTE: Agent 1 does NOT push code or open PRs — it only writes to Jira.
#   No GitHub PAT or contents:write permission is needed here.
# ─────────────────────────────────────────────────────────────

name: Agent 1 - Analyst

on:
  workflow_dispatch:
    inputs:
      story_key:
        description: "Optional: process a single story (e.g., SCRUM-30). Leave blank to scan all ai-ready stories."
        required: false
        default: ""
      dry_run:
        description: "Dry run — generate test case drafts but don't create Jira tickets"
        required: false
        type: boolean
        default: false
      sprint:
        description: "Optional: sprint name to scan (e.g. 'Sprint 10'). Leave blank to use config.yaml value. Use 'openSprints' for the currently active sprint."
        required: false
        default: ""
  schedule:
    # Every 30 minutes on the hour and half-hour, Mon-Fri 04:30-13:30 UTC
    # (= 10:00-19:00 IST). Deliberately NOT */15: GitHub throttles
    # frequent schedules on free/personal accounts and silently drops
    # runs, so asking for less reliably delivers more. The 30-min
    # pickup latency is irrelevant anyway - a human approval gate sits
    # between Agent 1 and Agent 2, and that wait is measured in hours.
    # NOTE: GitHub Actions cron may be delayed up to 15 min during high
    # platform load — effective worst-case latency is ~30 min.
    # 10:00-19:00 IST = 04:30-13:30 UTC. GitHub cron is ALWAYS UTC, and the
    # window straddles hour boundaries, so it needs three entries:
    - cron: "30 4 * * 1-5"        # 10:00 IST
    - cron: "0,30 5-12 * * 1-5"   # 10:30 - 18:00 IST, every 30 min
    - cron: "0,30 13 * * 1-5"     # 18:30 and 19:00 IST

# ──── NO push: TRIGGER (intentional) ────
# Per user direction, Agent 1 runs on cron ONLY. See agent2_coder.yml
# for the full rationale.

# Agent 1 only writes to Jira — no contents/pull-requests permissions needed.
permissions:
  contents: read

# Prevent overlapping scans. If a previous scan is still running when the
# next cron fires, the new run waits in a queue rather than starting in
# parallel. Without this, two concurrent scans could race to label the
# same story and create duplicate Jira test case issues.
concurrency:
  group: agent1-analyst
  cancel-in-progress: false

jobs:
  analyze:
    name: Draft Test Cases
    runs-on: ubuntu-latest
    timeout-minutes: 10  # cap: 2 stories × ~2 min/story + setup overhead

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Agent 1
        env:
          # LLM credentials (any OpenAI-compatible endpoint)
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ vars.OPENAI_API_BASE }}
          # Model routing (backlog 1.2). Agent 1 designs test cases — a
          # Sonnet-class model handles this well at a fraction of Opus pricing.
          # Kept in the Anthropic family so structured-output behaviour and the
          # tuned prompt rules carry over unchanged. Override with the
          # LLM_MODEL_LIGHT repo variable; falls back to LLM_MODEL, then Opus.
          LLM_MODEL: ${{ vars.LLM_MODEL_LIGHT || vars.LLM_MODEL || 'claude-opus-4-6' }}

          # Optional pricing (USD per 1M tokens) for real cost numbers in logs.
          # Set as repo Variables; leave unset to log token counts only.
          LLM_PRICE_INPUT_PER_1M: ${{ vars.LLM_PRICE_INPUT_PER_1M }}
          LLM_PRICE_OUTPUT_PER_1M: ${{ vars.LLM_PRICE_OUTPUT_PER_1M }}

          # Jira credentials
          JIRA_URL: ${{ vars.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
          # Optional — needed only when config.yaml uses sprint: "auto".
          JIRA_BOARD_ID: ${{ vars.JIRA_BOARD_ID }}
        run: |
          # Pick the right CLI mode based on trigger:
          #   - workflow_dispatch with story_key → process that single story
          #   - workflow_dispatch with no story_key → scan mode
          #   - schedule (cron) → always scan mode (no inputs available)
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          # Build optional --sprint flag. Only used in scan mode.
          # Cron runs never have inputs, so this is always blank on schedule trigger.
          SPRINT_FLAG=""
          if [ -n "${{ github.event.inputs.sprint }}" ]; then
            SPRINT_FLAG="--sprint ${{ github.event.inputs.sprint }}"
          fi

          if [ -n "${{ github.event.inputs.story_key }}" ]; then
            echo "Mode: single story (${{ github.event.inputs.story_key }}) — manual trigger"
            python -m agents.agent1_analyst --story "${{ github.event.inputs.story_key }}" $DRY_RUN_FLAG
          else
            echo "Mode: scan (process up to max_stories_per_run from config.yaml)"
            echo "Trigger: ${{ github.event_name }}"
            python -m agents.agent1_analyst --scan $DRY_RUN_FLAG $SPRINT_FLAG
          fi