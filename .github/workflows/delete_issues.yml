# ─────────────────────────────────────────────────────────────
# Delete closed issues (by hand only)
#
# Deletes tracker issues for good, by key: throw-away validation issues, or
# defects the pipeline raised and closed. Guards (scripts/delete_issues.py):
# the confirm input must be DELETE, an issue that is not closed or has
# sub-tasks is kept, at most 50 keys a run. Deletion cannot be undone.
# Run workflow -> keys "PRJ-1, PRJ-2", confirm "DELETE".
# ─────────────────────────────────────────────────────────────

name: Delete closed issues

on:
  workflow_dispatch:
    inputs:
      keys:
        description: "Issue keys to delete, comma-separated (closed issues only)"
        required: true
        type: string
      confirm:
        description: "Type DELETE - deletion cannot be undone"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: delete-issues
  cancel-in-progress: false

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Delete
        shell: bash            # -o pipefail: a kept key fails the run through tee
        env:
          KEYS: ${{ inputs.keys }}
          CONFIRM: ${{ inputs.confirm }}
          JIRA_URL: ${{ vars.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
        run: python -m scripts.delete_issues --keys "$KEYS" --confirm "$CONFIRM" | tee -a "$GITHUB_STEP_SUMMARY"
