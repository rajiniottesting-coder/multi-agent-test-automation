# ─────────────────────────────────────────────────────────────
# Agent 4 (Runner) + Agent 5 (Reporter) — automated test execution
# and Jira reporting on PRs.
#
# This is the "dynamic analysis" half of our PR check pipeline:
#   - Agent 3 (Reviewer) statically analyzes code → catches bugs by reading
#   - Agent 4 (Runner) actually runs the tests → catches bugs by execution
#   - Agent 5 (Reporter) posts results to Jira → closes the feedback loop
#
# Both Agent 3 and Agent 4 run in parallel on every PR. Agent 5 runs after
# Agent 4 finishes (whether tests pass or fail — failures need reporting too).
#
# WHEN THIS RUNS:
#   - PR opened, synchronized (new commits), or reopened
#   - Manual trigger via Actions tab → workflow_dispatch
#
# WHAT IT DOES:
#   Job 1 (test) — Agent 4:
#     1. Checkout PR branch
#     2. Setup Python 3.13 + cache pip dependencies
#     3. Install Python deps + Playwright browsers
#     4. Run pytest (CI=true forces headless mode automatically)
#     5. Upload test report (HTML + JUnit XML) as artifact
#     6. PR shows ✅ green check or ❌ red X based on test outcome
#
#   Job 2 (report) — Agent 5:
#     7. Wait for Agent 4 to finish (pass or fail)
#     8. Download the pytest reports from Job 1
#     9. Parse junit.xml, ask LLM to write a friendly Jira summary,
#        post to the parent Jira story (auto-detected from PR branch
#        per the convention in docs/BRANCH_NAMING.md)
#
# REQUIRED REPO SECRETS:
#   For Agent 4 (test job): none — SauceDemo is public.
#   For Agent 5 (report job):
#     - GOOGLE_API_KEY      — Gemini for the LLM summary
#     - JIRA_URL            — e.g. https://yoursite.atlassian.net
#     - JIRA_EMAIL          — your Atlassian account email
#     - JIRA_API_TOKEN      — token from id.atlassian.com → API tokens
#     - JIRA_PROJECT_KEY    — your Jira project key (e.g., SCRUM, PROD, MOBILE)
#
# See docs/CONFIGURATION.md for the full env-var reference.
# ─────────────────────────────────────────────────────────────

name: Agent 4 - Runner

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch: {}  # allow manual triggering from Actions tab

permissions:
  contents: read
  checks: write          # to publish test result checks on the PR
  pull-requests: write   # in case we want to comment results in future

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Agent 4 (Runner) — runs the tests
  # ─────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pytest-html generates a self-contained HTML report — handy as a PR artifact
          pip install pytest-html

      - name: Install Playwright browsers
        # `--with-deps` installs the OS-level libs Chromium needs (libnss, etc.)
        # The browser binaries are cached automatically on subsequent runs.
        run: playwright install --with-deps chromium

      - name: Run tests
        # CI=true is auto-set by GitHub Actions, which our conftest.py uses
        # to force headless mode (overriding config.yaml's headless: false).
        # We also generate two report formats:
        #   - HTML: human-readable, viewable as artifact
        #   - JUnit XML: parseable, used for the GitHub check annotation
        run: |
          pytest tests/ \
            --html=reports/pytest-report.html \
            --self-contained-html \
            --junit-xml=reports/junit.xml \
            -v

      - name: Upload test report
        if: always()  # upload report even if tests failed (we want to see WHY)
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ github.run_id }}
          path: reports/
          retention-days: 14

      - name: Publish test results as PR check
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: reports/junit.xml
          check_name: "Agent 4 — Test Results"

  # ─────────────────────────────────────────────────────────────
  # Job 2: Agent 5 (Reporter) — posts results to Jira
  #
  # Depends on `test` job. Uses `if: always()` so Agent 5 ALSO runs
  # when tests fail — failures need to be reported back to Jira just
  # as much as passes do (arguably more so).
  #
  # Skipped on workflow_dispatch (no PR/branch context to derive the
  # story key from). Also skipped — gracefully, exit 0 — for any PR
  # whose branch doesn't contain a Jira key (see docs/BRANCH_NAMING.md).
  # ─────────────────────────────────────────────────────────────
  report:
    name: Post Results to Jira
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test
    if: always() && github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        # Agent 5 needs the agent code, prompts, and config to run.
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download test reports from Job 1
        # Each GitHub Actions job runs on a fresh runner, so reports/
        # generated in `test` job is gone. We download the artifact
        # we uploaded earlier.
        uses: actions/download-artifact@v4
        with:
          name: pytest-report-${{ github.run_id }}
          path: reports/

      - name: Run Agent 5 (Reporter)
        # Agent 5 auto-detects the story key from the PR branch name
        # (any branch containing a Jira key like PROJ-123, e.g.,
        # `auto/PROJ-123-feature` or `feature/PROJ-456-foo`).
        # All other context (PR number, run URL, commit SHA) comes from
        # the auto-set GITHUB_* environment variables.
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
        run: |
          python -m agents.agent5_reporter --reports-dir reports/