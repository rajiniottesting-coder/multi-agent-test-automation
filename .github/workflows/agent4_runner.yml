# ─────────────────────────────────────────────────────────────
# Agent 4 (Runner) — automatic test execution on PRs
#
# This is the "dynamic analysis" half of our PR check pipeline:
#   - Agent 3 (Reviewer) statically analyzes code → catches bugs by reading
#   - Agent 4 (Runner) actually runs the tests → catches bugs by execution
#
# Both Agent 3 and Agent 4 run in parallel on every PR. After Agent 4
# completes, the SEPARATE Agent 5 workflow (agent5_reporter.yml) is
# triggered automatically via workflow_run — keeping each agent visible
# as its own CI check on the PR.
#
# WHEN THIS RUNS:
#   - PR opened, synchronized (new commits), or reopened
#   - Manual trigger via Actions tab → workflow_dispatch
#
# WHAT IT DOES:
#   1. Checkout PR branch
#   2. Setup Python 3.13 + cache pip dependencies
#   3. Install Python deps + Playwright browsers
#   4. Run pytest (CI=true forces headless mode automatically)
#   5. Save PR number alongside reports (so Agent 5 can find it)
#   6. Upload test report (HTML + JUnit XML) as artifact for Agent 5
#   7. Publish JUnit results as a PR check
# ─────────────────────────────────────────────────────────────

name: Agent 4 - Runner

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch: {}  # allow manual triggering from Actions tab

permissions:
  contents: read
  checks: write          # to publish test result checks on the PR
  pull-requests: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pytest-html generates a self-contained HTML report — handy as a PR artifact
          pip install pytest-html

      - name: Cache Playwright browsers
        # Playwright's browser binary (Chromium) is ~300 MB and takes ~2-3 min
        # to download. Caching it between runs saves significant CI time.
        # Cache key includes OS and requirements.txt hash — if either changes,
        # we re-download (e.g., a new Playwright version may need a new binary).
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browsers
        # `--with-deps` installs the OS-level libs Chromium needs (libnss, etc.).
        # The browser binary itself is restored from cache when the key matches —
        # `playwright install` is idempotent and skips already-installed browsers.
        # We still run it (vs. conditional skip) because OS-level apt packages
        # are NOT cached and need to be reinstalled fresh each run.
        run: playwright install --with-deps chromium

      - name: Run tests
        # CI=true is auto-set by GitHub Actions, which our conftest.py uses
        # to force headless mode (overriding config.yaml's headless: false).
        # We also generate two report formats:
        #   - HTML: human-readable, viewable as artifact
        #   - JUnit XML: parseable, used for the GitHub check annotation
        run: |
          pytest tests/ \
            --html=reports/pytest-report.html \
            --self-contained-html \
            --junit-xml=reports/junit.xml \
            -v

      - name: Save PR metadata for Agent 5
        # When Agent 5 is triggered by workflow_run, it doesn't have direct
        # access to the original PR event payload. We bundle the PR number
        # with the artifact so Agent 5 can read it. (head_branch is derivable
        # from the workflow_run event, but PR number is harder to get.)
        if: always() && github.event_name == 'pull_request'
        run: |
          mkdir -p reports
          echo "${{ github.event.pull_request.number }}" > reports/pr_number.txt

      - name: Upload test report
        if: always()  # upload report even if tests failed (we want to see WHY)
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ github.run_id }}
          path: reports/
          retention-days: 14

      - name: Publish test results as PR check
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: reports/junit.xml
          check_name: "Test Results"