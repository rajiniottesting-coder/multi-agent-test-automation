# ─────────────────────────────────────────────────────────────
# Agent 4 (Runner) + Agent 5 (Reporter) — combined CI workflow
#
# This workflow handles BOTH test execution (Agent 4) and Jira reporting
# (Agent 5) in two sequential jobs within a single workflow file. Both
# jobs appear as separate checks on the PR:
#
#   ✅ Agent 4 - Runner / Run Tests              (test execution)
#   ✅ Agent 4 - Runner / Post Results to Jira   (Agent 5's reporting)
#
# WHY ONE WORKFLOW (not split into two):
#   We previously tried splitting Agent 5 into its own workflow with a
#   `workflow_run` trigger, but that has two architectural problems:
#     1. workflow_run-triggered workflows DON'T appear as PR checks
#        (they only show in the Actions tab — design choice by GitHub)
#     2. workflow_run runs in a different event context, making PR/branch
#        detection more fragile (silent failures when story key can't be
#        resolved from the workflow_run event payload)
#
#   Combining both into one workflow with two jobs (`test` and `report`,
#   with `report` depending on `test`) gives us:
#     - Both visible as PR checks (what users actually want)
#     - Reliable PR/branch detection (real pull_request event context)
#     - Simpler artifact passing (job-to-job within same workflow_run id)
#
# COSMETIC TRADE-OFF:
#   Agent 5's check displays as "Agent 4 - Runner / Post Results to Jira"
#   instead of "Agent 5 - Reporter / Post Results to Jira". This is because
#   GitHub labels checks as "<workflow-name> / <job-name>". Acceptable
#   trade-off for getting visibility + reliability.
#
# WHEN THIS RUNS:
#   - PR opened, synchronized (new commits), or reopened
#   - Push to main touching FRAMEWORK code (see `paths` below). Runs the
#     unit-test gate ONLY: no browsers, no E2E, no Jira.
#   - Manual trigger via Actions tab → workflow_dispatch
#
# WHY THE PUSH TRIGGER EXISTS:
#   The framework's own unit tests used to run only as a step inside this
#   workflow's `pull_request` path. A framework change pushed to main
#   therefore fired NOTHING: its first execution was whenever the next agent
#   PR happened to open — by which point it was already merged and already
#   generating code — and a failure showed up as a red check on an unrelated
#   auto/SCRUM-nn story PR, blaming the wrong change.
#
# EVENT MATRIX:
#   step / job            pull_request   push (main)   workflow_dispatch   schedule (main)
#   unit-test gate             yes           yes             yes               yes
#   Chromium install           yes            -              yes               yes
#   app E2E tests              yes            -              yes               yes
#   retry of failures          yes            -              yes               yes
#   report artifact            yes            -              yes               yes
#   job summary                yes           yes             yes               yes
#   Agent 5 -> Jira            yes            -               -                 -
#   defect triage -> Jira       -        (if E2E ran)   (on main)             yes
#   ("-" for push: unless a runtime-affecting file changed, then the E2E and
#   triage run too - see "Detect runtime-affecting changes".)
# ─────────────────────────────────────────────────────────────

name: Agent 4 - Runner

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

  # Framework self-test gate.
  #
  # `paths` is declared ONLY under push, deliberately. The same filter on
  # `pull_request` would SKIP Agent 4 on story PRs, because those touch
  # features/, tests/step_defs/ and generated pages/*_page.py — none of
  # which appear below. Generated page objects are excluded on purpose:
  # only pages/base_page.py is watched, and path policy makes it a reserved
  # file no agent may write. So merging a story PR cannot re-fire this build.
  push:
    branches: [main]
    paths:
      - 'agents/**'
      - 'core/**'
      - 'validators/**'
      - 'integrations/**'
      - 'config/**'
      - 'inventory_tools/**'
      - 'scripts/**'
      - 'tests/unit/**'
      - 'pages/base_page.py'
      # The inventory is CODE as far as the suite is concerned: a renamed key
      # fails test_every_sel_key_used_exists_in_the_real_inventory and the
      # multi_match cross-checks immediately. Without this path an inventory
      # edit triggered NO workflow at all - not "ran and passed", but never
      # ran - so a typo surfaced during a story run ten minutes and a dollar
      # later instead of here in 90 seconds.
      - 'app_inventory/**'
      # The two conftest files are not inputs to any agent, but they ARE the
      # E2E runtime: tests/conftest.py owns the browser and the evidence
      # capture, tests/step_defs/conftest.py owns every page-object fixture
      # and the credential resolver. Break either and every E2E test fails,
      # and until now neither triggered anything at all.
      #
      # Listed individually, NOT as tests/step_defs/** - that directory also
      # holds Agent 2's generated step definitions, and including it would
      # re-fire this gate when a story PR merges, on files Agent 4 has
      # already tested.
      - 'tests/conftest.py'
      - 'tests/step_defs/conftest.py'
      # Prompts have no structural validation of their own, so this earns less;
      # it is here so that "what the agents read" is uniformly gated rather
      # than half-gated, which is the state that let this gap persist.
      - 'prompts/**'
      - 'requirements.txt'
      - 'pytest.ini'
      - '.github/workflows/agent4_runner.yml'

  workflow_dispatch: {}  # allow manual triggering from Actions tab

  # F-21: the whole app suite on main every night, outside business hours
  # (03:10 IST), so a regression the application ships with no pull request
  # open - another team's deploy - is found the next morning. No story report:
  # its failures go to the defect triage (F-22, the `triage` job below).
  schedule:
    - cron: "40 21 * * *"

permissions:
  contents: read
  pull-requests: write   # Agent 5 may need to read PR metadata

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Run the Playwright tests
  # ─────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    # 15 for the run itself + up to 15 waiting for earlier pull requests'
    # browser runs (the wait-for-turn step below) + up to 10 for retrying
    # failed tests once (at most MAX_RETRIED_TESTS of them, F-19).
    timeout-minutes: 40
    # 'false' only when a pull request changes nothing a test run reads (see
    # the pr_changes step); the report job then has no E2E result to post.
    outputs:
      e2e: ${{ steps.pr_changes.outputs.e2e }}
      # 'false' only on a push that changed nothing read at test runtime; the
      # triage job then has no E2E result to read.
      push_e2e: ${{ steps.changes.outputs.inventory }}
    # Serialise test runs per PR (or per branch on push) - two runs of one PR
    # must not drive the live application at the same time.
    #
    # JOB-level, not workflow-level, on purpose. A workflow-level group holds
    # the whole run back while an earlier one finishes, and GitHub creates no
    # check for a run that has not started: the PR then showed "All checks
    # have passed" with only Agent 3 listed, and the merge button green, while
    # Agent 4 for the newest commit had not run at all. A job-level group lets
    # the run start, so "Run Tests" is listed on the PR as waiting until its
    # turn comes - a merge before it finishes is visibly premature.
    #
    # cancel-in-progress is TRUE ONLY for push: superseding a main build costs
    # nothing. On pull_request it is FALSE on purpose - a cancelled run has no
    # settled conclusion, and scripts/sweep_stalled_prs.py treats "no settled
    # run for this SHA" as a stalled PR and reopens it to re-fire the event
    # chain. Cancelling story runs would manufacture exactly the condition the
    # sweeper is built to repair.
    #
    # The scheduled run has its own group: sharing main's would let a push to
    # main cancel the nightly run part-way.
    concurrency:
      group: agent4-${{ github.event.pull_request.number || (github.event_name == 'schedule' && 'scheduled') || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'push' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          # Two commits is enough for the inventory diff below; a full clone
          # would slow every run for no benefit.
          fetch-depth: 2

      # ── DID THIS PUSH TOUCH THE APP INVENTORY? ────────────────────
      # Page objects hold no selectors: they call self.sel("key") and BasePage
      # reads app_inventory/<app>.json AT RUNTIME. Editing the inventory
      # therefore changes what every existing E2E test does, with no code
      # change at all - and on a push only the unit suite ran, which proves the
      # inventory is structurally sound and nothing about whether the tests
      # still pass against it.
      #
      # The same is true of config.yaml (base_url, timeouts), base_page.py and
      # the two conftest files - all read while a test runs.
      #
      # A prompt change is deliberately NOT treated this way, nor is
      # core/app_context.py. Both are inputs to the AGENTS: they shape what
      # gets generated next time and cannot alter code that already exists, so
      # running a browser would prove nothing.
      #
      # Consulted on push only. A pull request has its own check (pr_changes,
      # below): it skips the E2E only when nothing changed is read at test
      # runtime. workflow_dispatch runs the E2E unconditionally.
      - name: Detect runtime-affecting changes
        id: changes
        if: github.event_name == 'push'
        # Advisory only. If this step dies - a git error, a $GITHUB_OUTPUT
        # write failure - the run must continue and the browser steps must
        # then FAIL OPEN (see their `!= 'false'` conditions). A detector that
        # can fail the job turns a diagnostic aid into a new way to go red.
        continue-on-error: true
        run: |
          BEFORE="${{ github.event.before }}"
          # A first push to a new branch has an all-zero before-SHA and nothing
          # to diff. Fall back to RUNNING the E2E: over-running wastes three
          # minutes, skipping it silently ships an untested change.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "no usable before-SHA; running the E2E to be safe"
            echo "inventory=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "before-SHA outside this shallow clone; running the E2E to be safe"
            echo "inventory=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Files READ WHILE A TEST RUNS. Changing any of them changes what
          # the existing E2E tests do, with no code change at all:
          #
          #   app_inventory/       BasePage.sel() resolves every selector here
          #   config/config.yaml   base_url, browser.timeout, headless
          #   pages/base_page.py   every page object inherits it
          #   tests/**conftest.py  the browser, the fixtures, the credentials
          #
          # Deliberately ABSENT: prompts/ and core/app_context.py. Both are
          # inputs to the AGENTS, not to a test run - they shape what gets
          # generated next time and cannot alter code that already exists, so
          # a browser run would prove nothing. The criterion is "is this read
          # at test runtime", not "is this an agent input".
          RUNTIME='^(app_inventory/|config/config\.yaml|pages/base_page\.py|tests/conftest\.py|tests/step_defs/conftest\.py)'
          CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          if echo "$CHANGED" | grep -qE "$RUNTIME"; then
            echo "runtime-affecting change - the E2E will run:"
            echo "$CHANGED" | grep -E "$RUNTIME" | sed 's/^/    /'
            echo "inventory=true" >> "$GITHUB_OUTPUT"
          else
            echo "no runtime-affecting change - unit tests only"
            echo "inventory=false" >> "$GITHUB_OUTPUT"
          fi

      # ── CAN THIS PULL REQUEST CHANGE A TEST RESULT? ───────────────
      # A pull request that changes only agent inputs and prose - prompts/
      # (agent prompts and the app-context notes), docs/, Markdown - cannot
      # change what any existing test does: nothing in it is read while a test
      # runs. Running the browser then proves nothing, and a live-site flake
      # turns such a PR red for a reason it cannot have caused. A context-
      # update PR that rewrites notes only is the case that hit this.
      #
      # Anything else - features, step definitions, page objects, the
      # inventory, config, conftest, requirements, workflows, an unknown path -
      # runs the E2E. The rule is core/test_runtime.py (stdlib only, so it runs
      # before dependencies are installed); Agent 3 uses the same rule so a
      # unit-only green run is never read as evidence about app tests. The
      # unit suite always runs.
      #
      # Fails open like the push detector: an API error or an empty file list
      # runs the E2E. Over-running costs minutes; under-running ships an
      # untested change behind a green tick.
      - name: Detect whether this pull request can change a test result
        id: pr_changes
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if ! FILES=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename'); then
            echo "could not list the pull request's files; running the E2E to be safe"
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed files:"
          echo "$FILES" | sed 's/^/    /'
          if ! VERDICT=$(printf '%s\n' "$FILES" | python3 core/test_runtime.py); then
            echo "the runtime rule failed; running the E2E to be safe"
            VERDICT=true
          fi
          if [ "$VERDICT" = "false" ]; then
            echo "only prompts, docs or Markdown changed - unit tests only"
          else
            echo "a file read at test runtime changed (or none listed) - the E2E will run"
            VERDICT=true
          fi
          echo "e2e=$VERDICT" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pytest-html generates a self-contained HTML report — handy as a PR artifact
          pip install pytest-html

      - name: Cache Playwright browsers
        # Playwright's browser binary (Chromium) is ~300 MB and takes ~2-3 min
        # to download. Caching it between runs saves significant CI time.
        # Cache key includes OS and requirements.txt hash — if either changes,
        # we re-download (e.g., a new Playwright version may need a new binary).
        # Skipped on push ONLY when the detector explicitly reported no
        # runtime-affecting change. The test is `!= 'false'`, not `== 'true'`,
        # and the difference is the whole point: a skipped, crashed or empty
        # output must FAIL OPEN. With `== 'true'` a detector that died left the
        # output empty, the browser steps silently skipped, and the job went
        # GREEN reporting "all unit tests passed" - an inventory change that no
        # browser had exercised, merged on a passing check.
        #
        # Over-running costs three minutes. Under-running ships an untested
        # change behind a green tick. Same reasoning as the fallbacks inside
        # the detector itself.
        if: (github.event_name != 'push' || steps.changes.outputs.inventory != 'false') && steps.pr_changes.outputs.e2e != 'false'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browsers
        # `--with-deps` installs the OS-level libs Chromium needs (libnss, etc.).
        # The browser binary itself is restored from cache when the key matches.
        # OS-level apt packages are NOT cached and need to be reinstalled fresh.
        # Skipped on push — saves ~2-3 min on every framework commit.
        if: (github.event_name != 'push' || steps.changes.outputs.inventory != 'false') && steps.pr_changes.outputs.e2e != 'false'
        run: playwright install --with-deps chromium

      - name: Framework self-test (unit tests)
        # Runs the framework's own unit tests FIRST as a gate. If the
        # framework itself is broken, the generated code's trustworthiness is
        # already in question, so we fail fast before running app E2E tests.
        # Written to a SEPARATE junit file so it never mixes into the story
        # report (Agent 5 only reports the app tests below).
        #
        # On push this step IS the job — every step after it is skipped.
        # Deliberately NOT `if: always()`: a failure here must fail the run.
        # No `env:` block, and none is needed — these tests touch no secret,
        # which is what makes the push path safe to run without any.
        #
        # `mkdir -p reports` because reports/ is gitignored and therefore
        # absent from a fresh checkout.
        run: |
          mkdir -p reports
          pytest tests/unit/ \
            --junit-xml=reports/junit-unit.xml \
            -v

      # ── WAIT FOR EARLIER PULL REQUESTS' BROWSER RUNS ──────────────
      # Every PR's E2E drives the same live application with the same test
      # accounts, and some of what a test does persists - so two PRs testing
      # at once change each other's results. First come, first served: wait
      # while a run of another PR that started earlier has not finished
      # (scripts/e2e_turn.py explains why a shared concurrency group cannot
      # do this). Bounded and fail-open: after MAX_WAIT_SECONDS, or if the
      # runs cannot be read, the tests run anyway - a possible overlap is
      # better than a stuck pipeline.
      - name: Wait for earlier pull requests' browser runs
        # always(): the E2E runs even when the unit gate failed, so the wait must too.
        # The scheduled run on main takes its turn too, and pull requests wait
        # for it: it drives the same application with the same accounts.
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'schedule') && steps.pr_changes.outputs.e2e != 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          MAX_WAIT_SECONDS: "900"
        run: |
          deadline=$(( $(date +%s) + MAX_WAIT_SECONDS ))
          while :; do
            if ! RUNS=$(gh api "repos/$REPO/actions/workflows/agent4_runner.yml/runs?per_page=100" --jq '.workflow_runs'); then
              echo "could not list the runs - not waiting"
              break
            fi
            if ! AHEAD=$(printf '%s' "$RUNS" | python3 scripts/e2e_turn.py --me "$RUN_ID" --branch "$BRANCH"); then
              echo "the turn rule failed - not waiting"
              break
            fi
            if [ -z "$AHEAD" ]; then
              echo "no earlier pull request is testing - our turn"
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::warning::Waited ${MAX_WAIT_SECONDS}s for run(s) $AHEAD; running the tests anyway."
              break
            fi
            echo "waiting for earlier run(s): $AHEAD"
            sleep 30
          done

      - name: Run app tests (generated E2E)
        id: e2e
        # CI=true is auto-set by GitHub Actions, which our conftest.py uses
        # to force headless mode (overriding config.yaml's headless: false).
        # This junit.xml contains ONLY the app-under-test E2E results — it's
        # what Agent 5 reads and reports to the Jira story, so the story's
        # test counts reflect the feature, not framework internals.
        # always() so a failed unit gate still yields E2E signal on a PR.
        # Never on push: no browser is installed, and the app secrets this
        # step needs are irrelevant to a framework change.
        if: always() && (github.event_name != 'push' || steps.changes.outputs.inventory != 'false') && steps.pr_changes.outputs.e2e != 'false'
        # Application credentials. Feature files log in by ROLE; the
        # `credentials` fixture (tests/step_defs/conftest.py) resolves the role
        # from these variables at runtime. Nothing authenticating is ever
        # committed to the repo. Secrets must be declared per-step - GitHub
        # does not inject them automatically.
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          # One secret per login role, matching the repo's Actions secrets.
          # Onboarding a different app means editing this list to that app's
          # roles - a deliberate trade: an explicit, greppable mapping that
          # matches the GitHub Secrets page one-to-one.
          APP_USER_REGISTERED: ${{ secrets.APP_USER_REGISTERED }}
        # Re-run a test ONLY when its failure names a temporary HTTP error from
        # the application under test (5xx, 429): from CI the site answers some
        # requests with 503 in short bursts while it loads fine in a browser
        # (L14). BasePage.navigate() already retries a page load; this covers
        # an action's own request (an add-to-cart call) failing that way. A
        # real assertion failure, a 404 or a timeout is not re-run HERE; the
        # retry step below gives every remaining failure one more try (F-19).
        #
        # This step never fails the job itself: pytest's exit code is kept as
        # an output, and "Decide the E2E result" (the last step) fails the job
        # on what is still failing after the retry - or on an interrupted run,
        # a collection error or no tests at all.
        run: |
          set +e
          pytest tests/step_defs/ \
            --html=reports/pytest-report.html \
            --self-contained-html \
            --junit-xml=reports/junit.xml \
            --reruns 2 --reruns-delay 20 \
            --only-rerun "HTTP (5[0-9][0-9]|429)\b" \
            -v
          code=$?
          echo "pytest exited with $code"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Keep only the final attempt of re-run tests in the report
        # pytest-rerunfailures writes every attempt as its own testcase, and a
        # re-run attempt has no <failure> - Agent 5, the run summary and Agent 3
        # would count it as a pass. Never fails the job.
        if: always() && (github.event_name != 'push' || steps.changes.outputs.inventory != 'false') && steps.pr_changes.outputs.e2e != 'false'
        run: python -m scripts.collapse_junit_reruns reports/junit.xml

      - name: Retry failed tests once
        # F-19: a test that fails and then passes when run again is FLAKY - it
        # counts as passed, and Agent 5 / the defect triage record it on the
        # pipeline health issue, so it is never silently forgotten nor raised
        # as a defect. A test that fails again is a failure. Only when pytest
        # reported failures (exit code 1), and not when more than
        # MAX_RETRIED_TESTS failed: that many at once is a broken build or an
        # outage, and retrying would only double the run.
        id: retry
        if: always() && (github.event_name != 'push' || steps.changes.outputs.inventory != 'false') && steps.pr_changes.outputs.e2e != 'false' && steps.e2e.outputs.exit_code == '1'
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          APP_USER_REGISTERED: ${{ secrets.APP_USER_REGISTERED }}
          MAX_RETRIED_TESTS: "10"
        run: |
          FAILED=$(python -m scripts.finalise_junit --count-failed reports/junit.xml)
          echo "failed tests: $FAILED"
          if [ "$FAILED" -lt 1 ] || [ "$FAILED" -gt "$MAX_RETRIED_TESTS" ]; then
            echo "not retrying ($FAILED failed; the limit is $MAX_RETRIED_TESTS)"
            exit 0
          fi
          set +e
          pytest tests/step_defs/ --last-failed --last-failed-no-failures none \
            --junit-xml=reports/junit-retry.xml -v
          echo "the retry exited with $?"
          exit 0

      - name: Mark what the run learned about each test
        # Merges the retry (a test that passed on it is marked `flaky`, or
        # `outage_recovered` when its first failure was the application's
        # outage) and marks every failure that says the application was
        # unavailable `outage` (core/junit_marks.py) - so this summary,
        # Agent 5, Agent 3 and the defect triage read one answer (F-7, F-19).
        # Never fails the job.
        if: always() && (github.event_name != 'push' || steps.changes.outputs.inventory != 'false') && steps.pr_changes.outputs.e2e != 'false'
        run: python -m scripts.finalise_junit reports/junit.xml --retry reports/junit-retry.xml

      # ── Allure ────────────────────────────────────────────────────────
      #
      # pytest writes reports/allure-results (raw JSON). Rendering it needs
      # the Allure CLI, which is not on the runner - so without these steps
      # the artifact contains results nobody can open without installing a
      # tool first, and the report may as well not exist.
      #
      # Generated as a SINGLE FILE. A directory report fetches its data over
      # XHR, which browsers block on file:// - so a downloaded folder shows
      # "Loading..." for ever and reads as broken. One self-contained HTML
      # opens by double-clicking, which is what somebody sent an artifact
      # will actually do.
      - name: Restore Allure history
        # TREND plots a series, and the series lives in the PREVIOUS report.
        # Nothing carries it between CI runs, which is why the panel says
        # "there is nothing to show" on the tenth run as loudly as the first.
        # A cache is enough: losing it costs one flat trend, not a failure.
        if: always()
        uses: actions/cache@v4
        with:
          path: reports/allure-report/history
          key: allure-history-${{ github.run_id }}
          restore-keys: |
            allure-history-

      - name: Generate the Allure report
        if: always()
        run: |
          set -euo pipefail
          if [ ! -d reports/allure-results ]; then
            echo "No allure-results; skipping."
            exit 0
          fi

          ALLURE_VERSION=2.30.0
          curl -sSL -o /tmp/allure.tgz \
            "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"
          tar -xzf /tmp/allure.tgz -C /tmp

          # conftest copies history into allure-results before the run, but on
          # a cache restore the folder appears afterwards - so carry it here
          # too. Copying twice is harmless; missing it flattens the trend.
          if [ -d reports/allure-report/history ]; then
            cp -r reports/allure-report/history reports/allure-results/ || true
          fi

          "/tmp/allure-${ALLURE_VERSION}/bin/allure" generate \
            reports/allure-results -o reports/allure-report --clean

          "/tmp/allure-${ALLURE_VERSION}/bin/allure" generate \
            reports/allure-results -o reports/allure-single --clean --single-file

          echo "### Allure report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the **pytest-report-${{ github.run_id }}** artifact below and open" >> "$GITHUB_STEP_SUMMARY"
          echo "\`allure-single/index.html\` - it is self-contained and needs no server." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test report
        # Required because the `report` job runs on a separate runner and
        # needs to download junit.xml to feed into Agent 5.
        # Also useful as a PR artifact for human inspection.
        # always() so we can see WHY a run failed. Skipped on push: the
        # `report` job (the only consumer) does not run there, and 14-day
        # artifacts for every framework commit are pure storage cost — the
        # job summary below already names the failing tests.
        if: always() && (github.event_name != 'push' || steps.changes.outputs.inventory != 'false')
        uses: actions/upload-artifact@v4
        # Only what someone reads: junit for Agent 5, the HTML report, the
        # one-file Allure report and the failure evidence. The multi-file
        # allure-report is the same report again, and allure-results is its raw
        # input - together they doubled every upload. 3 days: Agent 5 reads this
        # within minutes; the daily artifact_cleanup workflow is the backstop.
        with:
          name: pytest-report-${{ github.run_id }}
          path: |
            reports/
            !reports/allure-report/
            !reports/allure-results/
          retention-days: 3

      - name: Write test summary to Agent 4's run page
        # Inline Python that parses the junit report(s) and writes a markdown
        # summary to $GITHUB_STEP_SUMMARY. Replaces the buggy EnricoMi action.
        # Visible at: PR -> Checks -> "Run Tests" -> Summary section at top.
        #
        # Summarises BOTH reports on a pull_request. It used to summarise only
        # the app tests, so a failing framework unit gate showed up here as
        # nothing at all - you had to open the step log to find it. On push
        # there is no app report, so only the unit gate is listed.
        if: always()  # run even when pytest fails - failures need reporting
        env:
          # One line on purpose: a folded scalar would keep the newlines of an
          # indented continuation inside the ${{ }}, and the expression would
          # not evaluate.
          SUMMARY_REPORTS: ${{ (github.event_name == 'push' || steps.pr_changes.outputs.e2e == 'false') && 'reports/junit-unit.xml|Framework Unit Tests' || 'reports/junit-unit.xml|Framework Unit Tests;reports/junit.xml|App Tests (E2E)' }}
          # Why the E2E did or did not run, so a green tick cannot mean less
          # than it appears to. A summary reading "All 635 tests passed" with
          # no mention of the browser invites the reader to assume the app
          # tests passed too.
          E2E_EVENT: ${{ github.event_name }}
          E2E_DETECTOR: ${{ steps.changes.outputs.inventory }}
          E2E_DETECTOR_OUTCOME: ${{ steps.changes.outcome }}
          E2E_PR_VERDICT: ${{ steps.pr_changes.outputs.e2e }}
        run: |
          python3 << 'PYEOF'
          """Parse the junit report(s) and write a markdown summary to the GitHub
          Actions job summary page."""
          import os
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          sys.path.insert(0, ".")
          try:
              from core import junit_marks
          except Exception:
              junit_marks = None

          # WHICH reports to summarise comes from the step env, never from logic here,
          # so this is one code path for every event. Format: "path|Heading" entries
          # separated by ";". The unit gate is listed FIRST on purpose: when it failed
          # on a PR its result was invisible in this summary, which showed only the app
          # tests - a red framework gate hidden behind an app-test verdict.
          spec = os.environ.get("SUMMARY_REPORTS") or "reports/junit.xml|Test Results"
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")

          if not summary_path:
              print("Not running in GitHub Actions (no GITHUB_STEP_SUMMARY). Skipping.")
              raise SystemExit(0)


          def render(junit_path, scope):
              """Markdown lines for one junit file, plus a one-line console echo.

              Never raises: a missing or corrupt report becomes a reported failure,
              not a traceback that buries the cause it was meant to surface.
              """
              if not junit_path.exists():
                  print(f"{scope}: no report at {junit_path}")
                  return [f"## \u274c {scope}", "",
                          f"**No report found at `{junit_path}`.** That step produced no "
                          "report - see its output above for the actual error.", ""]
              try:
                  tree = ET.parse(junit_path)
              except ET.ParseError as exc:
                  print(f"{scope}: unreadable report {junit_path} ({exc})")
                  return [f"## \u274c {scope}", "",
                          f"**Unreadable report `{junit_path}`** ({exc}). The run almost "
                          "certainly crashed mid-write - see the step output above.", ""]

              root = tree.getroot()
              suites = root.findall("testsuite") if root.tag == "testsuites" else [root]

              total = sum(int(s.get("tests", 0)) for s in suites)
              failures = sum(int(s.get("failures", 0)) for s in suites)
              errors = sum(int(s.get("errors", 0)) for s in suites)
              skipped = sum(int(s.get("skipped", 0)) for s in suites)
              duration = sum(float(s.get("time", 0)) for s in suites)
              passed = total - failures - errors - skipped

              # F-7: a failure marked `outage` (scripts/finalise_junit.py) says
              # the application was unavailable - counted and listed apart, so a
              # 503 burst never reads as N broken tests.
              outage_cases = [c for suite in suites for c in suite.findall("testcase")
                              if junit_marks is not None and junit_marks.is_outage(c)]
              # F-19: passed only when retried once - passed, but named.
              flaky_cases = [c for suite in suites for c in suite.findall("testcase")
                             if junit_marks is not None and junit_marks.is_flaky(c)]
              outage_failed = sum(1 for c in outage_cases if c.find("failure") is not None)
              outage_n = len(outage_cases)
              failures -= outage_failed
              errors -= outage_n - outage_failed

              if total == 0:
                  # pytest wrote a report but collected nothing - a collection error or
                  # a bad path filter. Never report that as green.
                  status_emoji, status_text = "\u26a0\ufe0f", "No tests were collected"
              elif failures == 0 and errors == 0 and outage_n == 0:
                  status_emoji, status_text = "\u2705", f"All {total} tests passed"
                  if flaky_cases:
                      status_text += f" ({len(flaky_cases)} only on the retry - flaky)"
              elif failures == 0 and errors == 0:
                  status_emoji = "\u26a0\ufe0f"
                  status_text = (f"No test failed, but {outage_n} of {total} could not be "
                                 "judged: the application was unavailable")
              else:
                  status_emoji = "\u274c"
                  status_text = f"{failures + errors} of {total} tests failed"
                  if outage_n:
                      status_text += (f" ({outage_n} more could not be judged: the "
                                      "application was unavailable)")

              lines = [f"## {status_emoji} {scope}", "",
                       f"**{status_text}** in {duration:.2f}s", "",
                       "| Status | Count |", "|---|---|",
                       f"| \u2705 Passed | {passed} |",
                       f"| \u274c Failed | {failures} |",
                       f"| \U0001f4a5 Errored | {errors} |",
                       f"| \u23ed\ufe0f Skipped | {skipped} |"]
              if outage_n:
                  lines.append(f"| \U0001f310 Application unavailable | {outage_n} |")
              if flaky_cases:
                  lines.append(f"| \u267b\ufe0f Passed on the retry (flaky, in Passed) | "
                               f"{len(flaky_cases)} |")
              lines += [f"| **Total** | **{total}** |", ""]

              failed_cases = []
              for suite in suites:
                  for case in suite.findall("testcase"):
                      failure = case.find("failure")
                      error = case.find("error")
                      if failure is None and error is None:
                          continue
                      if case in outage_cases:
                          continue
                      issue = failure if failure is not None else error
                      msg = (issue.get("message") or issue.text or "").strip()
                      first_line = msg.splitlines()[0] if msg else "(no message)"
                      if len(first_line) > 200:
                          first_line = first_line[:197] + "..."

                      # The DISPLAY line stays one line. The text handed to the
                      # classifier does not: for the readiness-probe class the
                      # message is only `assert False` and the sentence that
                      # classifies it is in the captured log, which pytest.ini
                      # now routes into <system-out> (junit_logging = log).
                      # Reading the message alone reported these "unclassified".
                      body = "\n".join(
                          part for part in (msg, issue.text or "") if part)
                      captured = "\n".join(
                          (node.text or "")
                          for tag in ("system-out", "system-err")
                          for node in case.findall(tag))
                      failed_cases.append(
                          (f'{case.get("classname", "")}::{case.get("name", "")}',
                           first_line, body, captured))

              if failed_cases:
                  # Each failure carries a CAUSE and a FIX, not just a message.
                  # A raw Playwright error names what the framework was doing,
                  # never what was wrong with the app, so this summary used to
                  # say nothing actionable to anyone who had not spent a day
                  # reading traces.
                  #
                  # diagnose_with_context, not diagnose: it widens into the
                  # captured log ONLY when the traceback alone came back
                  # unclassified, so every reading that is right today is
                  # unchanged and the probe class stops falling through.
                  try:
                      from core.failure_diagnosis import diagnose_with_context
                  except Exception as exc:
                      diagnose_with_context = None
                      import_error = exc
                  lines += ["### Failures", ""]
                  if diagnose_with_context is None:
                      # Say so. A summary that silently drops the Cause/Fix
                      # lines looks like a failure nobody could read, which is
                      # the exact silence this whole mechanism exists to end.
                      lines += [f"> Could not import the failure classifier "
                                f"(`{import_error}`), so the readings below "
                                f"are missing.", ""]
                  for test_name, first_line, body, captured in failed_cases:
                      lines += [f"- **`{test_name}`**", f"  - {first_line}"]
                      if diagnose_with_context is not None:
                          d = diagnose_with_context(body, captured)
                          lines += [f"    - **Cause ({d.label}):** {d.cause}",
                                    f"    - **Fix:** {d.remedy}"]
                  lines.append("")

              if outage_cases:
                  lines += ["### Application unavailable (not test failures)", "",
                            "These tests failed because the application refused or never "
                            "answered their requests, after the retries. They say nothing "
                            "about the change: check the application, then re-run.", ""]
                  for case in outage_cases:
                      issue = case.find("failure") if case.find("failure") is not None \
                          else case.find("error")
                      msg = ((issue.get("message") or issue.text or "").strip().splitlines()
                             or ["(no message)"])[0][:200]
                      lines += [f'- **`{case.get("classname", "")}::{case.get("name", "")}`**',
                                f"  - {msg}"]
                  lines.append("")

              if flaky_cases:
                  lines += ["### Passed only on the retry (flaky)", "",
                            "Failed, then passed when run once more. Counted as passed and "
                            "recorded on the pipeline health issue; a test that keeps "
                            "appearing here is worth fixing.", ""]
                  for case in flaky_cases:
                      first = ""
                      if junit_marks is not None:
                          first = junit_marks.props(case).get("first_failure", "")
                      lines += [f'- **`{case.get("classname", "")}::{case.get("name", "")}`**'
                                + (f" - first failure: {first[:200]}" if first else "")]
                  lines.append("")

              print(f"{scope}: {total} total, {passed} passed, {failures} failed, "
                    f"{errors} errored, {skipped} skipped, {outage_n} unavailable, "
                    f"{duration:.2f}s")
              return lines


          out = []
          for entry in [e.strip() for e in spec.split(";") if e.strip()]:
              path_str, _, scope = entry.partition("|")
              out += render(Path(path_str.strip()), scope.strip() or "Test Results")

          # Evidence pointer: reports/ is uploaded as the run artifact, and the page
          # fixture drops a screenshot, a video and a Playwright trace under
          # failure-evidence/ for every FAILED test. Nothing said so, so nobody looked.
          evidence = Path("reports/failure-evidence")
          shots = sorted(evidence.glob("*.png")) if evidence.is_dir() else []
          if shots:
              out += ["### Failure evidence", "",
                      f"{len(shots)} failing test(s) captured a screenshot, a video and a "
                      "Playwright trace. Download the `pytest-report-*` artifact from "
                      "this run and open `reports/failure-evidence/`; view a trace with "
                      "`playwright show-trace <file>.trace.zip`.", ""]

          # ── Why the browser did or did not run ──────────────────────
          # Three distinct cases, and conflating them is how a skipped E2E
          # reads as a passing one.
          event = os.environ.get("E2E_EVENT", "")
          verdict = (os.environ.get("E2E_DETECTOR") or "").strip()
          outcome = (os.environ.get("E2E_DETECTOR_OUTCOME") or "").strip()

          if event == "push":
              if outcome == "failure":
                  out += ["> ⚠️ **The change detector failed**, so the app E2E "
                          "was run anyway rather than skipped. Its result is "
                          "above. Check the *Detect runtime-affecting changes* "
                          "step for the error — a force-push is the usual "
                          "cause, since the previous SHA is then unreachable.",
                          ""]
              elif verdict == "false":
                  out += ["> ℹ️ **App E2E not run.** No runtime-affecting file "
                          "changed in this push, so only the unit suite ran. "
                          "The browser runs when `app_inventory/`, "
                          "`config/config.yaml`, `pages/base_page.py` or either "
                          "`conftest.py` changes — those are read while a test "
                          "runs, so editing them changes what the existing "
                          "tests do.",
                          ""]
              elif verdict == "true":
                  out += ["> ✅ A runtime-affecting file changed, so the app "
                          "E2E ran as well as the unit suite.", ""]
              else:
                  # Empty verdict with a non-failure outcome: the step was
                  # skipped or produced nothing. The E2E failed open, so say so.
                  out += ["> ⚠️ **The change detector produced no verdict**, so "
                          "the app E2E was run rather than skipped.", ""]

          if event == "pull_request" and (os.environ.get("E2E_PR_VERDICT") or "").strip() == "false":
              out += ["> ℹ️ **App E2E not run.** This pull request changes only "
                      "prompts, docs or Markdown - nothing a test reads while it "
                      "runs - so only the unit suite ran, and no result is "
                      "posted to Jira. Any other changed file runs the browser.",
                      ""]

          out += ["---", "_Generated by Agent 4 (Runner)._"]

          with open(summary_path, "a", encoding="utf-8") as f:
              f.write("\n".join(out) + "\n")
          PYEOF

      - name: Decide the E2E result
        # The run step keeps pytest's exit code instead of failing (so the
        # retry can run). This fails the job on what is STILL failing after
        # the retry, outages included - a test the application stopped was not
        # tested, so the check must not go green - and on a run that was
        # interrupted, could not collect, or produced no report or no tests.
        if: always() && (github.event_name != 'push' || steps.changes.outputs.inventory != 'false') && steps.pr_changes.outputs.e2e != 'false' && steps.e2e.outcome != 'skipped'
        run: python -m scripts.finalise_junit --verdict reports/junit.xml --exit-code "${{ steps.e2e.outputs.exit_code }}"

  # ─────────────────────────────────────────────────────────────
  # Job 2: Agent 5 — Post test results back to Jira
  # ─────────────────────────────────────────────────────────────
  # `needs: test` means this runs AFTER the test job completes.
  # `if: always() && github.event_name == 'pull_request'` ensures:
  #   - Run even if tests failed (failed tests need to be reported too)
  #   - Skip on workflow_dispatch (no PR context, no story key to find)
  #
  # Visible on PR as: "Agent 4 - Runner / Post Results to Jira"
  # Also skipped when the test job ran no E2E (a prompts/docs-only PR):
  # there is no app result to report, and such a branch has no story to
  # report to.
  report:
    name: Post Results to Jira
    needs: test
    if: always() && github.event_name == 'pull_request' && needs.test.outputs.e2e != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download test reports from test job
        # The `test` job uploaded reports/ as an artifact. We download it
        # here so Agent 5 can parse junit.xml. Same workflow run, so no
        # cross-workflow auth/run-id complexity needed.
        uses: actions/download-artifact@v4
        with:
          name: pytest-report-${{ github.run_id }}
          path: reports/

      - name: Run Agent 5 (Reporter)
        # Agent 5 reads:
        #   - PR branch from GITHUB_HEAD_REF (auto-set by GHA on pull_request)
        #   - PR number from PR_NUMBER env var (set explicitly here)
        #   - junit.xml from the downloaded artifact
        #   - Workflow context from GITHUB_* vars (auto-set)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ vars.OPENAI_API_BASE }}
          # Model routing (backlog 1.2). Agent 5 writes a short prose summary —
          # the cheapest capable tier is sufficient. All facts, links and counts
          # in the report are appended by Python (build_final_comment), not the
          # model, so a lighter model cannot degrade correctness here.
          # Override with LLM_MODEL_LIGHT; falls back to LLM_MODEL, then Opus.
          LLM_MODEL: ${{ vars.LLM_MODEL_LIGHT || vars.LLM_MODEL || 'claude-opus-4-6' }}
          # Optional pricing (USD per 1M tokens) for cost tracking
          LLM_PRICE_INPUT_PER_1M: ${{ vars.LLM_PRICE_INPUT_PER_1M }}
          LLM_PRICE_OUTPUT_PER_1M: ${{ vars.LLM_PRICE_OUTPUT_PER_1M }}
          JIRA_URL: ${{ vars.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
          # PR_NUMBER is read directly from the pull_request event — no
          # need for the artifact-passing workaround we used in the
          # workflow_run version. Real PR event context is available here.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Agent 5 reads the PR's changed files to scope the report to the
          # story's own tests, and the impact-results step reads the repo.
          # Without these the lookup failed silently ("GITHUB_TOKEN and
          # GITHUB_REPO must be set") and every story was reported unscoped.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ vars.GH_REPO || github.repository }}
        run: |
          python -m agents.agent5_reporter --reports-dir reports/

  # ─────────────────────────────────────────────────────────────
  # Job 3: defect triage for runs on main (F-22)
  # ─────────────────────────────────────────────────────────────
  # A test failing on main reached nobody: Agent 5 reports only on a pull
  # request's story. After a run on MAIN - the nightly schedule (F-21), a push
  # that ran the E2E, or a manual run on main - this raises one defect per
  # failing test and cause (core/defects.py), opens a pipeline health alert for
  # an outage, and records flakes. Never on a pull request.
  triage:
    name: Raise defects for failures on main
    needs: test
    if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.test.outputs.push_e2e != 'false'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One triage at a time: two would both raise the same new defect.
    concurrency:
      group: defect-triage
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download test reports from test job
        # A run that produced no report is itself reported by the triage
        # (a health alert), so a missing artifact must not stop this job.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: pytest-report-${{ github.run_id }}
          path: reports/

      - name: Triage the run
        env:
          JIRA_URL: ${{ vars.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
        run: |
          python -m scripts.triage_failures --reports-dir reports \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
