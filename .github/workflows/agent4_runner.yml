# ─────────────────────────────────────────────────────────────
# Agent 4 (Runner) + Agent 5 (Reporter) — combined CI workflow
#
# This workflow handles BOTH test execution (Agent 4) and Jira reporting
# (Agent 5) in two sequential jobs within a single workflow file. Both
# jobs appear as separate checks on the PR:
#
#   ✅ Agent 4 - Runner / Run Tests              (test execution)
#   ✅ Agent 4 - Runner / Post Results to Jira   (Agent 5's reporting)
#
# WHY ONE WORKFLOW (not split into two):
#   We previously tried splitting Agent 5 into its own workflow with a
#   `workflow_run` trigger, but that has two architectural problems:
#     1. workflow_run-triggered workflows DON'T appear as PR checks
#        (they only show in the Actions tab — design choice by GitHub)
#     2. workflow_run runs in a different event context, making PR/branch
#        detection more fragile (silent failures when story key can't be
#        resolved from the workflow_run event payload)
#
#   Combining both into one workflow with two jobs (`test` and `report`,
#   with `report` depending on `test`) gives us:
#     - Both visible as PR checks (what users actually want)
#     - Reliable PR/branch detection (real pull_request event context)
#     - Simpler artifact passing (job-to-job within same workflow_run id)
#
# COSMETIC TRADE-OFF:
#   Agent 5's check displays as "Agent 4 - Runner / Post Results to Jira"
#   instead of "Agent 5 - Reporter / Post Results to Jira". This is because
#   GitHub labels checks as "<workflow-name> / <job-name>". Acceptable
#   trade-off for getting visibility + reliability.
#
# WHEN THIS RUNS:
#   - PR opened, synchronized (new commits), or reopened
#   - Push to main touching FRAMEWORK code (see `paths` below). Runs the
#     unit-test gate ONLY: no browsers, no E2E, no Jira.
#   - Manual trigger via Actions tab → workflow_dispatch
#
# WHY THE PUSH TRIGGER EXISTS:
#   The framework's own unit tests used to run only as a step inside this
#   workflow's `pull_request` path. A framework change pushed to main
#   therefore fired NOTHING: its first execution was whenever the next agent
#   PR happened to open — by which point it was already merged and already
#   generating code — and a failure showed up as a red check on an unrelated
#   auto/SCRUM-nn story PR, blaming the wrong change.
#
# EVENT MATRIX:
#   step / job            pull_request   push (main)   workflow_dispatch
#   unit-test gate             yes           yes             yes
#   Chromium install           yes            -              yes
#   app E2E tests              yes            -              yes
#   report artifact            yes            -              yes
#   job summary                yes           yes             yes
#   Agent 5 -> Jira            yes            -               -
# ─────────────────────────────────────────────────────────────

name: Agent 4 - Runner

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

  # Framework self-test gate.
  #
  # `paths` is declared ONLY under push, deliberately. The same filter on
  # `pull_request` would SKIP Agent 4 on story PRs, because those touch
  # features/, tests/step_defs/ and generated pages/*_page.py — none of
  # which appear below. Generated page objects are excluded on purpose:
  # only pages/base_page.py is watched, and path policy makes it a reserved
  # file no agent may write. So merging a story PR cannot re-fire this build.
  push:
    branches: [main]
    paths:
      - 'agents/**'
      - 'core/**'
      - 'validators/**'
      - 'integrations/**'
      - 'config/**'
      - 'inventory_tools/**'
      - 'scripts/**'
      - 'tests/unit/**'
      - 'pages/base_page.py'
      - 'requirements.txt'
      - 'pytest.ini'
      - '.github/workflows/agent4_runner.yml'

  workflow_dispatch: {}  # allow manual triggering from Actions tab

permissions:
  contents: read
  pull-requests: write   # Agent 5 may need to read PR metadata

# Serialise runs per PR (or per branch on push).
#
# cancel-in-progress is TRUE ONLY for push: superseding a main build costs
# nothing. On pull_request it is FALSE on purpose — a cancelled run has no
# settled conclusion, and scripts/sweep_stalled_prs.py treats "no settled run
# for this SHA" as a stalled PR and reopens it to re-fire the event chain.
# Cancelling story runs would manufacture exactly the condition the sweeper
# is built to repair.
concurrency:
  group: agent4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Run the Playwright tests
  # ─────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pytest-html generates a self-contained HTML report — handy as a PR artifact
          pip install pytest-html

      - name: Cache Playwright browsers
        # Playwright's browser binary (Chromium) is ~300 MB and takes ~2-3 min
        # to download. Caching it between runs saves significant CI time.
        # Cache key includes OS and requirements.txt hash — if either changes,
        # we re-download (e.g., a new Playwright version may need a new binary).
        # Skipped on push: the unit gate needs the playwright PACKAGE (already
        # installed from requirements.txt), never the browser BINARY.
        if: github.event_name != 'push'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browsers
        # `--with-deps` installs the OS-level libs Chromium needs (libnss, etc.).
        # The browser binary itself is restored from cache when the key matches.
        # OS-level apt packages are NOT cached and need to be reinstalled fresh.
        # Skipped on push — saves ~2-3 min on every framework commit.
        if: github.event_name != 'push'
        run: playwright install --with-deps chromium

      - name: Framework self-test (unit tests)
        # Runs the framework's own unit tests FIRST as a gate. If the
        # framework itself is broken, the generated code's trustworthiness is
        # already in question, so we fail fast before running app E2E tests.
        # Written to a SEPARATE junit file so it never mixes into the story
        # report (Agent 5 only reports the app tests below).
        #
        # On push this step IS the job — every step after it is skipped.
        # Deliberately NOT `if: always()`: a failure here must fail the run.
        # No `env:` block, and none is needed — these tests touch no secret,
        # which is what makes the push path safe to run without any.
        #
        # `mkdir -p reports` because reports/ is gitignored and therefore
        # absent from a fresh checkout.
        run: |
          mkdir -p reports
          pytest tests/unit/ \
            --junit-xml=reports/junit-unit.xml \
            -v

      - name: Run app tests (generated E2E)
        # CI=true is auto-set by GitHub Actions, which our conftest.py uses
        # to force headless mode (overriding config.yaml's headless: false).
        # This junit.xml contains ONLY the app-under-test E2E results — it's
        # what Agent 5 reads and reports to the Jira story, so the story's
        # test counts reflect the feature, not framework internals.
        # always() so a failed unit gate still yields E2E signal on a PR.
        # Never on push: no browser is installed, and the app secrets this
        # step needs are irrelevant to a framework change.
        if: always() && github.event_name != 'push'
        # Application credentials. Feature files log in by ROLE; the
        # `credentials` fixture (tests/step_defs/conftest.py) resolves the role
        # from these variables at runtime. Nothing authenticating is ever
        # committed to the repo. Secrets must be declared per-step - GitHub
        # does not inject them automatically.
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          # One secret per login role, matching the repo's Actions secrets.
          # Onboarding a different app means editing this list to that app's
          # roles - a deliberate trade: an explicit, greppable mapping that
          # matches the GitHub Secrets page one-to-one.
          APP_USER_ADMIN: ${{ secrets.APP_USER_ADMIN }}
        run: |
          pytest tests/step_defs/ \
            --html=reports/pytest-report.html \
            --self-contained-html \
            --junit-xml=reports/junit.xml \
            -v

      - name: Upload test report
        # Required because the `report` job runs on a separate runner and
        # needs to download junit.xml to feed into Agent 5.
        # Also useful as a PR artifact for human inspection.
        # always() so we can see WHY a run failed. Skipped on push: the
        # `report` job (the only consumer) does not run there, and 14-day
        # artifacts for every framework commit are pure storage cost — the
        # job summary below already names the failing tests.
        if: always() && github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ github.run_id }}
          path: reports/
          retention-days: 14

      - name: Write test summary to Agent 4's run page
        # Inline Python that parses the junit report(s) and writes a markdown
        # summary to $GITHUB_STEP_SUMMARY. Replaces the buggy EnricoMi action.
        # Visible at: PR -> Checks -> "Run Tests" -> Summary section at top.
        #
        # Summarises BOTH reports on a pull_request. It used to summarise only
        # the app tests, so a failing framework unit gate showed up here as
        # nothing at all - you had to open the step log to find it. On push
        # there is no app report, so only the unit gate is listed.
        if: always()  # run even when pytest fails - failures need reporting
        env:
          # One line on purpose: a folded scalar would keep the newlines of an
          # indented continuation inside the ${{ }}, and the expression would
          # not evaluate.
          SUMMARY_REPORTS: ${{ github.event_name == 'push' && 'reports/junit-unit.xml|Framework Unit Tests' || 'reports/junit-unit.xml|Framework Unit Tests;reports/junit.xml|App Tests (E2E)' }}
        run: |
          python3 << 'PYEOF'
          """Parse the junit report(s) and write a markdown summary to the GitHub
          Actions job summary page."""
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          # WHICH reports to summarise comes from the step env, never from logic here,
          # so this is one code path for every event. Format: "path|Heading" entries
          # separated by ";". The unit gate is listed FIRST on purpose: when it failed
          # on a PR its result was invisible in this summary, which showed only the app
          # tests - a red framework gate hidden behind an app-test verdict.
          spec = os.environ.get("SUMMARY_REPORTS") or "reports/junit.xml|Test Results"
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")

          if not summary_path:
              print("Not running in GitHub Actions (no GITHUB_STEP_SUMMARY). Skipping.")
              raise SystemExit(0)


          def render(junit_path, scope):
              """Markdown lines for one junit file, plus a one-line console echo.

              Never raises: a missing or corrupt report becomes a reported failure,
              not a traceback that buries the cause it was meant to surface.
              """
              if not junit_path.exists():
                  print(f"{scope}: no report at {junit_path}")
                  return [f"## \u274c {scope}", "",
                          f"**No report found at `{junit_path}`.** That step produced no "
                          "report - see its output above for the actual error.", ""]
              try:
                  tree = ET.parse(junit_path)
              except ET.ParseError as exc:
                  print(f"{scope}: unreadable report {junit_path} ({exc})")
                  return [f"## \u274c {scope}", "",
                          f"**Unreadable report `{junit_path}`** ({exc}). The run almost "
                          "certainly crashed mid-write - see the step output above.", ""]

              root = tree.getroot()
              suites = root.findall("testsuite") if root.tag == "testsuites" else [root]

              total = sum(int(s.get("tests", 0)) for s in suites)
              failures = sum(int(s.get("failures", 0)) for s in suites)
              errors = sum(int(s.get("errors", 0)) for s in suites)
              skipped = sum(int(s.get("skipped", 0)) for s in suites)
              duration = sum(float(s.get("time", 0)) for s in suites)
              passed = total - failures - errors - skipped

              if total == 0:
                  # pytest wrote a report but collected nothing - a collection error or
                  # a bad path filter. Never report that as green.
                  status_emoji, status_text = "\u26a0\ufe0f", "No tests were collected"
              elif failures == 0 and errors == 0:
                  status_emoji, status_text = "\u2705", f"All {total} tests passed"
              else:
                  status_emoji = "\u274c"
                  status_text = f"{failures + errors} of {total} tests failed"

              lines = [f"## {status_emoji} {scope}", "",
                       f"**{status_text}** in {duration:.2f}s", "",
                       "| Status | Count |", "|---|---|",
                       f"| \u2705 Passed | {passed} |",
                       f"| \u274c Failed | {failures} |",
                       f"| \U0001f4a5 Errored | {errors} |",
                       f"| \u23ed\ufe0f Skipped | {skipped} |",
                       f"| **Total** | **{total}** |", ""]

              failed_cases = []
              for suite in suites:
                  for case in suite.findall("testcase"):
                      failure = case.find("failure")
                      error = case.find("error")
                      if failure is None and error is None:
                          continue
                      issue = failure if failure is not None else error
                      msg = (issue.get("message") or issue.text or "").strip()
                      first_line = msg.splitlines()[0] if msg else "(no message)"
                      if len(first_line) > 200:
                          first_line = first_line[:197] + "..."
                      failed_cases.append(
                          (f'{case.get("classname", "")}::{case.get("name", "")}',
                           first_line))

              if failed_cases:
                  lines += ["### Failures", ""]
                  for test_name, msg in failed_cases:
                      lines += [f"- **`{test_name}`**", f"  - {msg}"]
                  lines.append("")

              print(f"{scope}: {total} total, {passed} passed, {failures} failed, "
                    f"{errors} errored, {skipped} skipped, {duration:.2f}s")
              return lines


          out = []
          for entry in [e.strip() for e in spec.split(";") if e.strip()]:
              path_str, _, scope = entry.partition("|")
              out += render(Path(path_str.strip()), scope.strip() or "Test Results")

          # Evidence pointer: reports/ is uploaded as the run artifact, and the page
          # fixture drops a screenshot, a video and a Playwright trace under
          # failure-evidence/ for every FAILED test. Nothing said so, so nobody looked.
          evidence = Path("reports/failure-evidence")
          shots = sorted(evidence.glob("*.png")) if evidence.is_dir() else []
          if shots:
              out += ["### Failure evidence", "",
                      f"{len(shots)} failing test(s) captured a screenshot, a video and a "
                      "Playwright trace. Download the `pytest-report-*` artifact from "
                      "this run and open `reports/failure-evidence/`; view a trace with "
                      "`playwright show-trace <file>.trace.zip`.", ""]

          out += ["---", "_Generated by Agent 4 (Runner)._"]

          with open(summary_path, "a", encoding="utf-8") as f:
              f.write("\n".join(out) + "\n")
          PYEOF

  # ─────────────────────────────────────────────────────────────
  # Job 2: Agent 5 — Post test results back to Jira
  # ─────────────────────────────────────────────────────────────
  # `needs: test` means this runs AFTER the test job completes.
  # `if: always() && github.event_name == 'pull_request'` ensures:
  #   - Run even if tests failed (failed tests need to be reported too)
  #   - Skip on workflow_dispatch (no PR context, no story key to find)
  #
  # Visible on PR as: "Agent 4 - Runner / Post Results to Jira"
  report:
    name: Post Results to Jira
    needs: test
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download test reports from test job
        # The `test` job uploaded reports/ as an artifact. We download it
        # here so Agent 5 can parse junit.xml. Same workflow run, so no
        # cross-workflow auth/run-id complexity needed.
        uses: actions/download-artifact@v4
        with:
          name: pytest-report-${{ github.run_id }}
          path: reports/

      - name: Run Agent 5 (Reporter)
        # Agent 5 reads:
        #   - PR branch from GITHUB_HEAD_REF (auto-set by GHA on pull_request)
        #   - PR number from PR_NUMBER env var (set explicitly here)
        #   - junit.xml from the downloaded artifact
        #   - Workflow context from GITHUB_* vars (auto-set)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ vars.OPENAI_API_BASE }}
          # Model routing (backlog 1.2). Agent 5 writes a short prose summary —
          # the cheapest capable tier is sufficient. All facts, links and counts
          # in the report are appended by Python (build_final_comment), not the
          # model, so a lighter model cannot degrade correctness here.
          # Override with LLM_MODEL_LIGHT; falls back to LLM_MODEL, then Opus.
          LLM_MODEL: ${{ vars.LLM_MODEL_LIGHT || vars.LLM_MODEL || 'claude-opus-4-6' }}
          # Optional pricing (USD per 1M tokens) for cost tracking
          LLM_PRICE_INPUT_PER_1M: ${{ vars.LLM_PRICE_INPUT_PER_1M }}
          LLM_PRICE_OUTPUT_PER_1M: ${{ vars.LLM_PRICE_OUTPUT_PER_1M }}
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          # PR_NUMBER is read directly from the pull_request event — no
          # need for the artifact-passing workaround we used in the
          # workflow_run version. Real PR event context is available here.
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python -m agents.agent5_reporter --reports-dir reports/