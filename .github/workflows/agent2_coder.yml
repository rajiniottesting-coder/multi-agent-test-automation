# ─────────────────────────────────────────────────────────────
# Agent 2 (Coder) — manual trigger via GitHub Actions UI
#
# This workflow runs Agent 2 in CI when a human clicks "Run workflow"
# from the Actions tab. It is the production path for Agent 2.
#
# WHEN THIS RUNS:
#   - Manually triggered from GitHub Actions UI (workflow_dispatch)
#   - Optional inputs: process a single story or scan for all approved
#
# WHY MANUAL TRIGGER (not automatic):
#   Agent 2 generates code and opens PRs — those are write actions with
#   real cost (LLM tokens) and real consequences (PRs visible to your
#   team). A human-clicked button is the safest production trigger:
#     - You decide WHEN to spend tokens
#     - You confirm AGAIN that the queued stories should be processed
#     - Misclicked Jira labels can't accidentally fire a costly run
#
#   Future enhancement: scheduled trigger (cron) once we trust the queue.
#
# HUMAN-APPROVAL GATE:
#   Agent 2's selection criteria (in config/config.yaml) require BOTH:
#     - `ai-processed`   (Agent 1 finished generating Test Case issues)
#     - `human-approved` (you reviewed the test cases on Jira and approved)
#   AND must NOT have:
#     - `ai-coded`       (Agent 2 already produced a PR — idempotency)
#     - `ai-skip`        (manual override / opt-out)
#
#   This is the architectural checkpoint: AI proposes test cases,
#   human approves on Jira, AI implements. Catching a bad test case
#   here is cheap; catching it after Agent 2 generates code is wasteful.
#
# ─────────────────────────────────────────────────────────────

name: Agent 2 - Coder

on:
  workflow_dispatch:
    inputs:
      story_key:
        description: "Optional: process a single story (e.g., SCRUM-13). Leave blank to scan all approved stories."
        required: false
        default: ""
      dry_run:
        description: "Dry run — generate code but don't open PR"
        required: false
        type: boolean
        default: false
      sprint:
        description: "Optional: sprint name to scan (e.g. 'Sprint 10'). Leave blank to use config.yaml value. Use 'openSprints' for the currently active sprint."
        required: false
        default: ""
      chain:
        description: "Set by the hand-off (core/handoff.py): runs started in a row. Leave blank."
        required: false
        default: ""
  # Started by a tracker rule (an automation calling GitHub's repository_dispatch
  # with this event type, e.g. when a person approves) - scan mode, as on schedule.
  repository_dispatch:
    types: [agent2_coder]
  schedule:
    # Every 30 minutes, weekdays 10:00-19:00 IST (04:30-13:30 UTC; GitHub cron
    # is always UTC), at minute :12/:42 - never on :00 or :30. GitHub starts
    # only some scheduled runs of a quiet repository, and drops runs set for
    # the start of an hour or half hour first (3 Nov 2026: 4 of 19 a day,
    # for two months). Each agent has its own minutes, so they do not fire
    # together: Agent 0 :02/:32, Agent 1 :07/:37, Agent 2 :12/:42. The
    # schedule is the safety net; the hand-off (core/handoff.py) and a
    # tracker rule start the agents when work arrives.
    - cron: "42 4 * * 1-5"        # 10:12 IST
    - cron: "12,42 5-12 * * 1-5"   # 10:42 - 18:12 IST, every 30 min
    - cron: "12,42 13 * * 1-5"     # 18:42 and 19:12 IST

# ──── NO push: TRIGGER (intentional) ────
# We previously added a push failsafe when GitHub Actions cron was
# silently throttled. Agent 2 runs on its schedule, starts itself again while
# stories wait past max_stories_per_run (the last step, core/handoff.py), and
# can be started by a tracker rule when a person approves (repository_dispatch
# `agent2_coder` - GUIDE, "Hand-off between agents"). Still no push trigger.
# If cron throttling returns (a known platform issue for free personal
# accounts), regular agent activity (PRs, commits) keeps the scheduler
# alive. For a one-shot manual run, use the `workflow_dispatch` button
# in the Actions UI. (A separate keep-alive workflow existed for this
# but was removed in July 2026 — redundant with regular activity, and
# its direct pushes to main conflicted with branch protection.)

permissions:
  contents: write       # Agent 2 creates branches and commits
  pull-requests: write  # Agent 2 opens PRs
  actions: write        # start the next scan while stories wait (core/handoff.py)

# Prevent overlapping scans. Without this, two concurrent runs could
# race to create the same branch / push the same files / open the
# same PR, producing weird half-states or duplicate PRs.
concurrency:
  group: agent2-coder
  cancel-in-progress: false

jobs:
  generate:
    name: Generate Test Code
    runs-on: ubuntu-latest
    # F-4: setup (~1.5 min) + the scan deadline (agents.agent2_coder.
    # scan_deadline_minutes, 12) + one story started just before it (slowest
    # measured ~8 min) + margin. Under the 30-minute cron interval, so scans
    # never queue behind each other. A kill mid-story would waste its spend.
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Agent 2 reads reference test files from the working tree, so we
          # checkout main (the latest reviewed code base) as the source-of-truth
          # for what "good" Playwright code looks like.
          ref: main

      - name: Agent identity (the GitHub App's token, else GH_PAT)
        id: identity
        uses: ./.github/actions/agent-identity
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          fallback-token: ${{ secrets.GH_PAT }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python dependencies
        id: deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Record the stories waiting before the run
        # The restart step below starts this agent again only if the run took
        # one of these: a story it skips (a blocked one) stays waiting, and
        # restarting would repeat the skip (core/handoff.py).
        if: github.event.inputs.dry_run != 'true'
        continue-on-error: true
        env:
          JIRA_URL: ${{ vars.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
          JIRA_BOARD_ID: ${{ vars.JIRA_BOARD_ID }}
        run: python -m scripts.start_agent --agent agent2_coder --record-waiting reports/handoff_waiting.json

      - name: Run Agent 2
        # Agent 2 needs read+write access to:
        #   - Jira (read approved stories, mark them ai-coded)
        #   - GitHub (create branches, commit files, open PRs)
        #   - LLM API (calls for Stage 1 plan + Stage 2 file generation)
        env:
          # LLM credentials (any OpenAI-compatible endpoint)
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ vars.OPENAI_API_BASE }}

          # LLM model selection — override via LLM_MODEL repo variable
          # if you want to use a different model.
          LLM_MODEL: ${{ vars.LLM_MODEL || 'claude-opus-4-6' }}

          # Optional pricing (USD per 1M tokens) for real cost numbers in logs.
          # Set as repo Variables; leave unset to log token counts only.
          LLM_PRICE_INPUT_PER_1M: ${{ vars.LLM_PRICE_INPUT_PER_1M }}
          LLM_PRICE_OUTPUT_PER_1M: ${{ vars.LLM_PRICE_OUTPUT_PER_1M }}

          # Jira credentials
          JIRA_URL: ${{ vars.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
          # Optional — needed only when config.yaml uses sprint: "auto".
          JIRA_BOARD_ID: ${{ vars.JIRA_BOARD_ID }}

          # GitHub credentials — Agent 2's GitHubClient reads GITHUB_TOKEN env.
          # GitHub reserves the GITHUB_* prefix for built-in vars/secrets, so
          # users can't create a secret named GITHUB_REPO. We store the repo
          # name as `GH_REPO` and map it to `GITHUB_REPO` inside the runner.
          #
          # CASCADE FIX (ADR-008) and the agents' identity (ADR-025, F-30):
          # not the built-in GITHUB_TOKEN - GitHub suppresses pull_request
          # events for a PR the built-in token opens (anti-recursion safety),
          # so Agents 3/4/5 would never run. The identity step's token is the
          # GitHub App's (its PRs are <app>[bot]'s, so a person can review
          # them), or GH_PAT until the App is configured; either fires the
          # events. See .github/actions/agent-identity/action.yml.
          GITHUB_TOKEN: ${{ steps.identity.outputs.token }}
          GITHUB_REPO: ${{ vars.GH_REPO }}
        run: |
          # Pick the right CLI flags based on workflow inputs:
          #   - With story_key:     process that one story
          #   - Without story_key:  scan mode (process all approved)
          # The dry_run flag is plumbed through from the workflow input.
          # Optional flags as arrays: an empty one passes nothing, and a flag
          # with a value stays one argument each (shellcheck SC2086).
          DRY_RUN_FLAG=()
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG=(--dry-run)
          fi

          # Build optional --sprint flag. Only used in scan mode.
          # Cron runs never have inputs, so this is always blank on schedule trigger.
          # One argument however many words the sprint's name has ("SCRUM
          # Sprint 1" was split into three before).
          SPRINT_FLAG=()
          if [ -n "${{ github.event.inputs.sprint }}" ]; then
            SPRINT_FLAG=(--sprint "${{ github.event.inputs.sprint }}")
          fi

          if [ -n "${{ github.event.inputs.story_key }}" ]; then
            echo "Mode: single story (${{ github.event.inputs.story_key }})"
            python -m agents.agent2_coder --story "${{ github.event.inputs.story_key }}" "${DRY_RUN_FLAG[@]}"
          else
            echo "Mode: scan (process all stories matching config.yaml selection)"
            python -m agents.agent2_coder --scan "${DRY_RUN_FLAG[@]}" "${SPRINT_FLAG[@]}"
          fi

      - name: Start Agent 2 again while stories wait
        # More stories waited than max_stories_per_run: the next run starts
        # now instead of at a schedule GitHub may drop (core/handoff.py).
        # Also after a red run: a run is red when one story needs a person,
        # and on 4 Nov 2026 that stopped the chain for every other story
        # waiting (the schedule, its only other path, rarely starts). No retry
        # loop: it starts again only if the run took a story that waited
        # (core/handoff.py), and handoff.max_chain bounds it.
        # Not when the run stopped before its checkout and dependencies:
        # there is no script to start, and nothing ran that a restart
        # follows (12 Nov 2026: 'No module named scripts' after a red
        # first step).
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        env:
          JIRA_URL: ${{ vars.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
          JIRA_BOARD_ID: ${{ vars.JIRA_BOARD_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
          CHAIN: ${{ github.event.inputs.chain }}
          STORY_KEY: ${{ github.event.inputs.story_key }}
        # A one-story run took only its own story: judged by what waited
        # before it, it would never start the scan the waiting stories need
        # (its own start may have stood back for this run - core/handoff.py).
        run: |
          WAITED=(--waiting-before reports/handoff_waiting.json)
          if [ -n "$STORY_KEY" ]; then WAITED=(); fi
          python -m scripts.start_agent --agent agent2_coder --previous-chain "$CHAIN" "${WAITED[@]}"
