# Move a story to Done when its PR is MERGED.
#
# Every other board move is made by an agent that just did work. Done is
# different: it means a human read the code and accepted it. So this is the one
# transition driven by a real merge event rather than a pipeline label.
#
# `pull_request: closed` fires for BOTH merges and rejections, so the job is
# gated on `merged == true`. A PR closed without merging means the work was not
# accepted and the card must stay in In Review.
name: Story Done on merge

on:
  pull_request:
    types:
      - closed          # fires on merge AND on close-without-merge
  workflow_dispatch:
    inputs:
      branch:
        description: "Head branch, e.g. auto/SCRUM-5-login (manual run only)"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: story-done-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  mark-done:
    # THE GATE: only a genuine merge moves the card. Without this, rejecting a
    # PR would mark the story Done — the opposite of what happened.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    # Well inside the hour an App's token lasts (F-30); the job takes minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # the merge target; agent code lives here

      - name: Agent identity (the GitHub App's token, else GH_PAT)
        id: identity
        uses: ./.github/actions/agent-identity
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          fallback-token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Move story to Done
        env:
          JIRA_URL: ${{ vars.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
        run: |
          python -m scripts.close_merged_story \
            --branch "${{ github.event.pull_request.head.ref || inputs.branch }}" \
            --merged "${{ github.event_name == 'workflow_dispatch' && 'true' || github.event.pull_request.merged }}"

      # The merged story's feature is live and tested: propose what it adds to
      # the app notes (rules, limits, messages, flow, test data) as a reviewed
      # PR (scripts/propose_context_addition.py, core/context_update.py). No
      # story key -> nothing; Agent 0 off -> nothing; shadow mode -> printed.
      # Runs after Done and never undoes it.
      - name: Propose the notes the story adds
        env:
          JIRA_URL: ${{ vars.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ vars.OPENAI_API_BASE }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'claude-opus-4-6' }}
          LLM_PRICE_INPUT_PER_1M: ${{ vars.LLM_PRICE_INPUT_PER_1M }}
          LLM_PRICE_OUTPUT_PER_1M: ${{ vars.LLM_PRICE_OUTPUT_PER_1M }}
          GITHUB_TOKEN: ${{ steps.identity.outputs.token }}
          GITHUB_REPO: ${{ vars.GH_REPO }}
          BRANCH: ${{ github.event.pull_request.head.ref || inputs.branch }}
        run: python -m scripts.propose_context_addition --branch "$BRANCH"
