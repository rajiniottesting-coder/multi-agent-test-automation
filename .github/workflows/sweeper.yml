# Sweeper — reliability backstop for event-driven agents (backlog 3.4)
#
# Agents 1 & 2 are cron-driven and self-heal. Agents 3 (review) and 4/5
# (run + report) are fired by the one-shot `pull_request` event; if that run is
# cancelled or never starts, the PR stalls silently. This sweeper runs hourly,
# finds open `auto/*` PRs whose Agent-3 or Agent-4 workflow has no settled run
# for the current commit, and reopens them to re-fire the event chain.
#
# It uses the agents' identity, like Agent 2 (the GitHub App, else GH_PAT -
# .github/actions/agent-identity). This is essential: the built-in
# GITHUB_TOKEN deliberately does NOT re-fire workflows, so a reopen with it would
# be a no-op for Agents 3/4. An App's or a person's reopen fires the event.
# See ADR-008 and ADR-025 in docs/DECISIONS.md.
name: Sweeper (stalled-PR backstop)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only; take no action"
        type: boolean
        default: false
  schedule:
    # Hourly at :05, Mon-Fri 09:00-19:00 UTC (= 14:30-00:30 IST).
    #
    # Aligned to the agents (0,30 9-18 UTC) rather than running 24/7: auto/*
    # PRs are only ever created inside the agent window, so sweeping at 03:00
    # on a Sunday can never find anything to nudge. This drops 168 runs/week
    # to 55 - which also eases GitHub's throttling of frequent schedules on
    # free accounts, the reason the agents moved off */15.
    #
    # The window runs ONE HOUR PAST the agents (19 vs 18) on purpose: a PR
    # opened at 17:55 has Agent 3/4 still executing at 18:05, and if that run
    # is cancelled it would otherwise sit stalled until the next business day.
    # The :05 offset keeps the sweeper clear of the agents' :00 tick.
    #
    # Outside this window, trigger manually via workflow_dispatch below.
    # Hourly at :05 past, 10:00-19:00 IST = 04:30-13:30 UTC. Cron is UTC.
    # Offset to :35/:05 so the sweeper lands between agent runs, not on top
    # of them - it looks for work the others left stalled.
    - cron: "35 4-12 * * 1-5"     # 10:05 - 18:05 IST
    - cron: "35 13 * * 1-5"       # 19:05 IST

# Governs the built-in token; our script uses the agents' identity, but keep
# least-privilege.
permissions:
  contents: read
  pull-requests: write
  actions: read

# Never let two sweeps overlap.
concurrency:
  group: sweeper
  cancel-in-progress: false

jobs:
  sweep:
    name: Re-trigger stalled PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Agent identity (the GitHub App's token, else GH_PAT)
        id: identity
        uses: ./.github/actions/agent-identity
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          fallback-token: ${{ secrets.GH_PAT }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run sweeper
        env:
          # PAT (not the built-in token) so the reopen re-fires pull_request.
          GITHUB_TOKEN: ${{ steps.identity.outputs.token }}
          GITHUB_REPO: ${{ vars.GH_REPO }}
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          python -m scripts.sweep_stalled_prs $DRY_RUN_FLAG