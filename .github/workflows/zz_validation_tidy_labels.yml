# VALIDATION window M (E46) - runs scripts/tidy_defect_labels on the tracker
# with the pipeline's credentials, list first, then --apply. Removed after.
name: zz validation - tidy defect labels

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Remove the labels (unticked: list only)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Tidy the defect labels
        env:
          JIRA_URL: ${{ vars.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then
            python -m scripts.tidy_defect_labels --apply
          else
            python -m scripts.tidy_defect_labels
          fi
