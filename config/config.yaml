# ────────────────────────────────────────────────────────────
# Application Under Test (AUT) — single source of truth
# ────────────────────────────────────────────────────────────
# All app-specific knowledge lives here. To onboard a new app:
#   1. Edit this section (name, base_url, inventory_file, references)
#   2. Drop a new <name>.json into app_inventory/
#   3. Drop your reference .feature, step-def .py, and page-object .py
#      into the locations listed under `reference_files` below
#   4. Update app context (prompts/app_context.md OR prompts/app_context/ modules) for
#      Agent 1's analyst prompt
#
# No agent code changes are needed. See docs/GUIDE.md "Onboarding a
# new app" section for the full checklist.
# ────────────────────────────────────────────────────────────
# Issue tracker
#
# Which tracker adapter the agents talk to. The pipeline needs only ten
# operations (read a story, find work, create/read test cases, move state
# markers), all defined by the `Tracker` Protocol in agents/tracker.py.
#
# Shipping to a client on a different tool means writing ONE adapter and
# changing this line - nothing in agents/ changes.
#
#   jira   - Atlassian Jira (default; adapter: agents/jira_client.py)
#
# To add another: implement the Protocol, register it in tracker._ADAPTERS
# (or call tracker.register_adapter at startup), then set the name here.
# ────────────────────────────────────────────────────────────
# ────────────────────────────────────────────────────────────
# Code host
#
# Where the generated test code lives. Agents 2/3/5 and the sweeper need
# branches, commits, pull requests, PR comments and CI status - all defined
# by the `RepoHost` Protocol in agents/repo_host.py.
#
#   github - GitHub (default; adapter: agents/github_client.py)
#
# NOTE: switching host also means replacing .github/workflows/*.yml, which is
# CI wiring rather than API calls and therefore outside the Protocol.
# ────────────────────────────────────────────────────────────
repo_host:
  type: "github"

# ────────────────────────────────────────────────────────────
# Board column automation  (optional)
#
# Labels drive the agents; STATUSES tell a human at a glance what is
# happening. Without this every story sits in "To Do" however far it has
# progressed, which makes the board useless at standup.
#
# Maps a completion LABEL onto a board STATUS. Column names live here, not in
# code, because they differ per tool and per team - Jira ships
# "To Do / In Progress / In Review / Done", Azure DevOps uses
# "New / Active / Resolved / Closed", and most boards are customised further.
#
# Stories still awaiting work (ai-ready / ai-update / ai-regenerate) are left
# alone and stay wherever they are, normally "To Do".
#
# A move that the workflow forbids is logged and ignored - board position is
# cosmetic and must never fail a run that has already done real work.
#
# Set enabled: false to leave statuses untouched (the previous behaviour).
# ────────────────────────────────────────────────────────────
status_workflow:
  enabled: true
  on_label:
    ai-processed: "In Progress"    # Agent 1 drafted test cases
    ai-coded: "In Review"          # Agent 2 opened a PR

  # Driven by a real MERGE event, not by a label. No agent sets this: merging
  # is the human decision the pipeline is built around, so only a human
  # merging the PR can move a card to Done.
  on_merge: "Done"

tracker:
  type: "jira"

app_under_test:
  name: "SauceDemo"
  base_url: "https://www.saucedemo.com"

  # Page inventory: a JSON file describing pages, selectors, methods.
  # See app_inventory/saucedemo.json as the canonical example. The
  # JSON shape is documented in docs/REUSE_FOR_NEW_PROJECT.md ("App inventory JSON schema").
  inventory_file: "app_inventory/saucedemo.json"

  # Reference files: existing tests Agent 2 mimics for style and Agent 3
  # uses as the style baseline. These are NOT edited by the agents —
  # they're the human-written gold standard the LLM learns from.
  reference_files:
    feature: "features/login.feature"
    step_def: "tests/step_defs/test_login.py"
    page_object: "pages/login_page.py"

  # Reserved paths: files Agent 2 must NEVER overwrite or modify.
  # These are typically the reference files used as the LLM's style baseline —
  # if the LLM rewrites them, you lose your gold-standard examples.
  reserved_paths:
    - "features/login.feature"
    - "tests/step_defs/test_login.py"
    - "pages/login_page.py"
    - "pages/base_page.py"

  # Extendable paths: existing files Agent 2 MAY modify by adding new methods,
  # but must not break or remove existing methods/signatures.
  # Page objects belong here because they naturally grow as new features are
  # automated (e.g., adding sort methods to InventoryPage when automating sort).
  # The LLM is told the rules in the Stage 1 prompt; the validator checks them.
  extendable_paths:
    - "pages/inventory_page.py"
    

# ────────────────────────────────────────────────────────────
# Browser & test framework configuration
# ────────────────────────────────────────────────────────────
browser:
  headless: false       # Set to true for CI runs (auto-overridden by CI=true env var)
  slow_mo: 100          # Milliseconds between actions (helps you SEE what's happening)
  viewport:
    width: 1280
    height: 720
  timeout: 30000        # 30 seconds default

# Legacy alias — agents now read from app_under_test.base_url, but this
# is kept so conftest.py (which uses BASE_URL env var fallback) still works.
base_url: https://www.saucedemo.com

# ────────────────────────────────────────────────────────────
# Login roles
#
# Credentials are NEVER stored here. Features log in by ROLE
# ("When I log in as \"standard\""); the `credentials` fixture in
# tests/step_defs/conftest.py resolves the role at runtime from
# APP_USERS / APP_PASSWORD (.env locally, GitHub Secrets in CI).
#
# The behaviour of each role is documented in prompts/app_context/
# and app_inventory/<app>.json, which is where the LLM reads it.
# ────────────────────────────────────────────────────────────

# ────────────────────────────────────────────────────────────
# Agent configuration
# Each agent has its own selection rules and completion markers.
# Naming convention: agent<N>_<role> reflects pipeline order.
# ────────────────────────────────────────────────────────────
agents:
  # Agent 1 — Analyst: Jira story → manual test cases
  agent1_analyst:
    selection:
      issue_type: "Story"
      allowed_statuses:
        - "To Do"
        - "In Progress"
        - "In Review"      # stories moved here by status_workflow after coding
      required_labels:
        - "ai-ready"
      excluded_labels:
        - "ai-processed"   # idempotency marker
        - "ai-skip"        # human override / opt-out
      # ── SPRINT SCOPING ──────────────────────────────────────────
      # "auto"          → resolve the currently ACTIVE sprint from Jira at
      #                   runtime via the JIRA_BOARD_ID env var. RECOMMENDED:
      #                   zero config changes at sprint boundaries.
      # "openSprints"   → Jira JQL dynamic alias; also targets the active
      #                   sprint but doesn't need JIRA_BOARD_ID (sprint name
      #                   won't appear in logs).
      # "Sprint 10"     → exact sprint name; update manually each sprint.
      # "42"            → numeric sprint ID (if names are not unique).
      # (omit key)      → no filter; scans across all sprints.
      # ─────────────────────────────────────────────────────────────
      sprint: "auto"
    completion_label: "ai-processed"
    # ONE-SHOT TRIGGER CLEANUP: labels removed from the parent story after
    # Agent 1 successfully creates test cases. Keeps the label state clean —
    # after a run, the story shows `ai-processed` only, not also the stale
    # `ai-ready` that triggered it. If omitted, the code falls back to
    # selection.required_labels (same set, same effect).
    trigger_labels_to_remove:
      - "ai-ready"
    # CAP for automated cron scans (Day 8): keep blast radius small if a
    # mislabel ever fires the cron unintentionally. Each Agent 1 run on a
    # story creates 3-7 Jira test case issues, which a human has to clean
    # up if they were unintended. With cap=2, a worst-case mislabel costs
    # ~$0.30 of LLM and ~10 garbage Jira tickets to clean up — recoverable.
    max_stories_per_run: 2

  # Agent 2 — Coder: approved test cases → Playwright code + PR
  #
  # Human-approval gate: a parent story must have BOTH `ai-processed`
  # (Agent 1 finished) AND `human-approved` (you reviewed the test cases
  # in Jira and approved them) before Agent 2 picks it up.
  #
  # AI-REGENERATE LABEL:
  #   When you modify an existing test case, you can force Agent 2 to
  #   regenerate code by adding the `ai-regenerate` label. In that mode,
  #   Agent 2 skips the dedup check, creates a new branch with -rev2/
  #   -rev3/... suffix, and removes the label after success (one-shot).
  agent2_coder:
    selection:
      issue_type: "Story"
      allowed_statuses:
        - "To Do"
        - "In Progress"
        - "In Review"      # stories moved here by status_workflow after coding
      required_labels:
        - "ai-processed"   # Agent 1 finished generating Test Case issues
        - "human-approved" # You approved the test cases in Jira
      excluded_labels:
        - "ai-coded"       # Agent 2 already opened a PR for this story
        - "ai-skip"        # human override / opt-out
        - "ai-regenerate"  # belongs in regenerate_selection, not normal scan
        - "ai-update"      # belongs in update_selection, not normal scan
      # Keep in sync with agent1_analyst.selection.sprint above.
      sprint: "auto"

    regenerate_selection:
      issue_type: "Story"
      allowed_statuses:
        - "To Do"
        - "In Progress"
        - "In Review"      # stories moved here by status_workflow after coding
      required_labels:
        - "ai-processed"
        - "human-approved"
        - "ai-regenerate"
      excluded_labels:
        - "ai-skip"
        - "ai-update"      # if both set, ai-regenerate wins (full regen)
      sprint: "auto"

    # INCREMENTAL UPDATE (ai-update label):
    #   Surgical alternative to ai-regenerate. Only modified/new scenarios
    #   are regenerated; unchanged scenarios are preserved byte-for-byte.
    #   Requires existing JIRA markers in the feature file — first-time
    #   stories MUST go through normal mode or ai-regenerate first to
    #   establish markers. The label is consumed one-shot after success.
    update_selection:
      issue_type: "Story"
      allowed_statuses:
        - "To Do"
        - "In Progress"
        - "In Review"      # stories moved here by status_workflow after coding
      required_labels:
        - "ai-processed"
        - "human-approved"
        - "ai-update"
      excluded_labels:
        - "ai-skip"
        - "ai-regenerate"  # exclusive — only one mode per scan
      sprint: "auto"

    completion_label: "ai-coded"
    regenerate_label: "ai-regenerate"
    update_label: "ai-update"
    # CAP for automated cron scans (Day 8): same reasoning as Agent 1.
    # Each Agent 2 run on a story spends ~$0.10-0.30 in LLM tokens and
    # opens a PR. With cap=2, worst-case mislabel costs ~$0.60 and 2 PRs
    # to close — recoverable. The human-approved label gate is still the
    # primary protection; this cap is the secondary safety net.
    max_stories_per_run: 2

  # agent3_reviewer:  # triggered by GitHub PR events, no Jira selection needed
  # agent4_runner:    # triggered by GitHub PR events (CI workflow only — no .py file)
  # agent5_reporter:  # triggered after Agent 4 in same workflow