# ────────────────────────────────────────────────────────────
# Browser & test framework configuration
# ────────────────────────────────────────────────────────────
browser:
  headless: false       # Set to true for CI runs
  slow_mo: 100          # Milliseconds between actions (helps you SEE what's happening)
  viewport:
    width: 1280
    height: 720
  timeout: 30000        # 30 seconds default

base_url: https://www.saucedemo.com

# ────────────────────────────────────────────────────────────
# Test data (intentionally in plain config — not secrets)
# ────────────────────────────────────────────────────────────
test_users:
  standard:
    username: standard_user
    password: secret_sauce
  locked_out:
    username: locked_out_user
    password: secret_sauce
  problem:
    username: problem_user
    password: secret_sauce

# ────────────────────────────────────────────────────────────
# Agent configuration
# Each agent has its own selection rules and completion markers.
# Naming convention: agent<N>_<role> reflects pipeline order.
# ────────────────────────────────────────────────────────────
agents:
  # Agent 1 — Analyst: Jira story → manual test cases
  agent1_analyst:
    selection:
      issue_type: "Story"
      allowed_statuses:
        - "To Do"
        - "In Progress"
      required_labels:
        - "ai-ready"
      excluded_labels:
        - "ai-processed"   # idempotency marker
        - "ai-skip"        # human override / opt-out
    completion_label: "ai-processed"
    max_stories_per_run: 10

  # Future agents will be configured here:
  # agent2_coder:
  #   selection: ...
  # agent3_reviewer:
  #   selection: ...
  # agent4_runner:
  #   selection: ...
  # agent5_reporter:
  #   selection: ...