# ────────────────────────────────────────────────────────────
# Application Under Test (AUT) — single source of truth
# ────────────────────────────────────────────────────────────
# All app-specific knowledge lives here. To onboard a new app:
#   1. Edit this section (name, base_url, inventory_file, references)
#   2. Drop a new <name>.json into app_inventory/
#   3. Drop your reference .feature, step-def .py, and page-object .py
#      into the locations listed under `reference_files` below
#   4. Update app context (prompts/app_context.md OR prompts/app_context/ modules) for
#      Agent 1's test-design prompt
#
# No agent code changes are needed. See docs/GUIDE.md "Onboarding a
# new app" section for the full checklist.
# ────────────────────────────────────────────────────────────
# Issue tracker
#
# Which tracker adapter the agents talk to. The pipeline needs only ten
# operations (read a story, find work, create/read test cases, move state
# markers), all defined by the `Tracker` Protocol in agents/tracker.py.
#
# Shipping to a client on a different tool means writing ONE adapter and
# changing this line - nothing in agents/ changes.
#
#   jira   - Atlassian Jira (default; adapter: agents/jira_client.py)
#
# To add another: implement the Protocol, register it in tracker._ADAPTERS
# (or call tracker.register_adapter at startup), then set the name here.
# ────────────────────────────────────────────────────────────
# ────────────────────────────────────────────────────────────
# Code host
#
# Where the generated test code lives. Agents 2/3/5 and the sweeper need
# branches, commits, pull requests, PR comments and CI status - all defined
# by the `RepoHost` Protocol in agents/repo_host.py.
#
#   github - GitHub (default; adapter: agents/github_client.py)
#
# NOTE: switching host also means replacing .github/workflows/*.yml, which is
# CI wiring rather than API calls and therefore outside the Protocol.
# ────────────────────────────────────────────────────────────
repo_host:
  type: "github"

# ────────────────────────────────────────────────────────────
# Board column automation  (optional)
#
# Labels drive the agents; STATUSES tell a human at a glance what is
# happening. Without this every story sits in "To Do" however far it has
# progressed, which makes the board useless at standup.
#
# Maps a completion LABEL onto a board STATUS. Column names live here, not in
# code, because they differ per tool and per team - Jira ships
# "To Do / In Progress / In Review / Done", Azure DevOps uses
# "New / Active / Resolved / Closed", and most boards are customised further.
#
# Stories still awaiting work (ai-ready / ai-update / ai-regenerate) are left
# alone and stay wherever they are, normally "To Do".
#
# A move that the workflow forbids is logged and ignored - board position is
# cosmetic and must never fail a run that has already done real work.
#
# Set enabled: false to leave statuses untouched (the previous behaviour).
# ────────────────────────────────────────────────────────────
status_workflow:
  enabled: true
  on_label:
    ai-processed: "In Progress"    # Agent 1 drafted test cases
    ai-coded: "In Review"          # Agent 2 opened a PR
    impact-reverted: "To Do"       # reconcile undid a closed-unmerged change

  # Driven by a real MERGE event, not by a label. No agent sets this: merging
  # is the human decision the pipeline is built around, so only a human
  # merging the PR can move a card to Done.
  on_merge: "Done"

  # A story whose pull request was closed WITHOUT merging, reset by reconcile
  # (core/impact_reconcile.py, F-16): back to where a person decides to retry
  # or drop it. Leave unset to keep the card where it is.
  on_close_unmerged: "To Do"

tracker:
  type: "jira"

  # Link types (Agent 0 design, A4). The agents never name a tracker link
  # type; they ask for a KIND and the adapter maps it here.
  #
  #   owns    - the story a test case belongs to: exactly one, never changes.
  #             Agent 1 creates it with the test case.
  #   impacts - a story that CHANGED a test case it does not own (or the
  #             story that owns it). None or many; they accumulate.
  #
  #   name          the link type's name in the tracker
  #   query         the link as read from the story's side ("<story> impacts X")
  #   inverse_query the link as read from the other side
  #   from_field    which side of the tracker's create-link call receives the
  #                 story. Jira's REST API reads `inwardIssue <outward> outwardIssue`,
  #                 so "<story> impacts <test>" puts the story in inwardIssue.
  #                 `owns` keeps the layout Agent 1 has always created
  #                 (test case inward, story outward); Relates reads the same
  #                 both ways.
  link_types:
    owns:    { name: "Relates", query: "relates to", inverse_query: "relates to", from_field: "outwardIssue" }
    impacts: { name: "Impacts", query: "impacts", inverse_query: "is impacted by", from_field: "inwardIssue" }

  # A test case retired by an approved Impact Review carries this label.
  # Every test case query skips it, so no later update brings it back.
  retired_label: "ai-retired"

app_under_test:
  name: "Automation Exercise"
  base_url: "https://automationexercise.com"

  # Page inventory: a JSON file describing pages, selectors, methods.
  # See app_inventory/automationexercise.json as the canonical example. The
  # JSON shape is documented in docs/REUSE_FOR_NEW_PROJECT.md ("App inventory JSON schema").
  inventory_file: "app_inventory/automationexercise.json"

  # Reference files: existing tests Agent 2 mimics for style and Agent 3
  # uses as the style baseline. These are NOT edited by the agents —
  # they're the human-written gold standard the LLM learns from.
  reference_files:
    feature: "features/login.feature"
    step_def: "tests/step_defs/test_login.py"
    page_object: "pages/login_page.py"

  # Reserved paths: files Agent 2 must NEVER overwrite or modify.
  # These are typically the reference files used as the LLM's style baseline —
  # if the LLM rewrites them, you lose your gold-standard examples.
  reserved_paths:
    - "features/login.feature"
    - "tests/step_defs/test_login.py"
    - "pages/login_page.py"
    - "pages/base_page.py"
    - "pages/nav_page.py"

  # Extendable paths: existing files Agent 2 MAY modify by adding new methods,
  # but must not break or remove existing methods/signatures.
  # Page objects belong here because they naturally grow as new features are
  # automated (e.g., adding sort methods to InventoryPage when automating sort).
  # The LLM is told the rules in the Stage 1 prompt; the validator checks them.
  #
  # Every page object already committed under pages/ is extendable
  # AUTOMATICALLY (auto_extend_page_objects below), except reserved files and
  # base_page.py. So nothing needs listing after a story merges: the next
  # story extends the file instead of regenerating it, and a check refuses any
  # change that removes a method other stories call.
  #
  # List a file here only for something the automatic rule cannot see, and
  # only once it is on main - see docs/GUIDE.md, "extendable_paths".
  extendable_paths: []
  auto_extend_page_objects: true


# ────────────────────────────────────────────────────────────
# Browser & test framework configuration
# ────────────────────────────────────────────────────────────
browser:
  headless: false       # Set to true for CI runs (auto-overridden by CI=true env var)
  slow_mo: 100          # Milliseconds between actions (helps you SEE what's happening)
  viewport:
    width: 1280
    height: 720
  timeout: 30000        # 30 seconds default
  # Waits before retrying a page load the server answered with a temporary
  # error (HTTP 5xx or 429): one retry per entry. [] turns the retry off.
  # A 4xx is never retried. Agent 4 also re-runs a test whose failure names an
  # HTTP 5xx/429 (agent4_runner.yml, --only-rerun), which covers an action's
  # own request - an add-to-cart call - failing that way.
  navigation_retry_delays_ms: [3000, 8000]

  # Third-party hosts to refuse at the browser.
  #
  # WHY THIS EXISTS
  #   An ad network on the site under test served a full-screen interstitial
  #   that CONSUMED the first navigation after a page load. The click reported
  #   success, the address gained a `#google_vignette` fragment, the browser
  #   never moved, and the next action waited its whole 30-second timeout for
  #   an element on a page nobody had reached. It appeared on some runs and
  #   not others, so the same suite passed and failed with no code change.
  #
  #   Every framework-side defence against this is a recovery AFTER the fact.
  #   Not loading the ad at all removes the failure mode instead of handling
  #   it, and it costs nothing: no advertising network is part of any
  #   application under test.
  #
  # These are HOST SUFFIXES, matched against the request's hostname. Add a
  # host here rather than teaching the framework about any particular network
  # - the code reads this list and knows nothing else.
  #
  # Set to an empty list to disable blocking entirely.
  block_hosts:
    - doubleclick.net
    - googlesyndication.com
    - googleadservices.com
    - adtrafficquality.google
    - fundingchoicesmessages.google.com
    - 2mdn.net

# Legacy alias — agents now read from app_under_test.base_url, but this
# is kept so conftest.py (which uses BASE_URL env var fallback) still works.
base_url: https://automationexercise.com

# ────────────────────────────────────────────────────────────
# Login roles
#
# Credentials are NEVER stored here. Features log in by ROLE
# ("When I log in as \"standard\""); the `credentials` fixture in
# tests/step_defs/conftest.py resolves the role at runtime from
# APP_USER_<ROLE> and APP_PASSWORD_<ROLE>, else APP_PASSWORD
# (.env locally, GitHub Secrets in CI).
#
# The behaviour of each role is documented in prompts/app_context/
# and app_inventory/<app>.json, which is where the LLM reads it.
# ────────────────────────────────────────────────────────────

# ────────────────────────────────────────────────────────────
# Agent configuration
# Each agent has its own selection rules and completion markers.
# Naming convention: agent<N>_<role> reflects pipeline order.
# ────────────────────────────────────────────────────────────
agents:
  # Agent 1 — Test Designer: Jira story → manual test cases
  agent1_analyst:
    selection:
      issue_type: "Story"
      allowed_statuses:
        - "To Do"
        - "In Progress"
        - "In Review"      # stories moved here by status_workflow after coding
      required_labels:
        - "ai-ready"
      excluded_labels:
        - "ai-processed"   # idempotency marker
        - "ai-skip"        # human override / opt-out
        # Agent 0 (C1): a story waiting for impact analysis or for its Impact
        # Review must not be drafted early, even if someone sets ai-ready.
        # The hand-over removes these and adds ai-ready.
        - "impact-check"
        - "impact-proposed"
      # ── SPRINT SCOPING ──────────────────────────────────────────
      # "auto"          → resolve the currently ACTIVE sprint from Jira at
      #                   runtime via the JIRA_BOARD_ID env var. RECOMMENDED:
      #                   zero config changes at sprint boundaries.
      # "openSprints"   → Jira JQL dynamic alias; also targets the active
      #                   sprint but doesn't need JIRA_BOARD_ID (sprint name
      #                   won't appear in logs).
      # "Sprint 10"     → exact sprint name; update manually each sprint.
      # "42"            → numeric sprint ID (if names are not unique).
      # (omit key)      → no filter; scans across all sprints.
      # ─────────────────────────────────────────────────────────────
      sprint: "auto"
    completion_label: "ai-processed"
    # ONE-SHOT TRIGGER CLEANUP: labels removed from the parent story after
    # Agent 1 successfully creates test cases. Keeps the label state clean —
    # after a run, the story shows `ai-processed` only, not also the stale
    # `ai-ready` that triggered it. If omitted, the code falls back to
    # selection.required_labels (same set, same effect).
    trigger_labels_to_remove:
      - "ai-ready"
    # CAP for automated cron scans (Day 8): keep blast radius small if a
    # mislabel ever fires the cron unintentionally. Each Agent 1 run on a
    # story creates 3-7 Jira test case issues, which a human has to clean
    # up if they were unintended. With cap=2, a worst-case mislabel costs
    # ~$0.30 of LLM and ~10 garbage Jira tickets to clean up — recoverable.
    max_stories_per_run: 2

  # Agent 2 — Coder: approved test cases → Playwright code + PR
  #
  # Human-approval gate: a parent story must have BOTH `ai-processed`
  # (Agent 1 finished) AND `human-approved` (you reviewed the test cases
  # in Jira and approved them) before Agent 2 picks it up.
  #
  # AI-REGENERATE LABEL:
  #   When you modify an existing test case, you can force Agent 2 to
  #   regenerate code by adding the `ai-regenerate` label. In that mode,
  #   Agent 2 skips the dedup check, creates a new branch with -rev2/
  #   -rev3/... suffix, and removes the label after success (one-shot).
  agent2_coder:
    selection:
      issue_type: "Story"
      allowed_statuses:
        - "To Do"
        - "In Progress"
        - "In Review"      # stories moved here by status_workflow after coding
      required_labels:
        - "ai-processed"   # Agent 1 finished generating Test Case issues
        - "human-approved" # You approved the test cases in Jira
      excluded_labels:
        - "ai-coded"       # Agent 2 already opened a PR for this story
        - "ai-skip"        # human override / opt-out
        - "ai-regenerate"  # belongs in regenerate_selection, not normal scan
        - "ai-update"      # belongs in update_selection, not normal scan
      # Keep in sync with agent1_analyst.selection.sprint above.
      sprint: "auto"

    regenerate_selection:
      issue_type: "Story"
      allowed_statuses:
        - "To Do"
        - "In Progress"
        - "In Review"      # stories moved here by status_workflow after coding
      required_labels:
        - "ai-processed"
        - "human-approved"
        - "ai-regenerate"
      excluded_labels:
        - "ai-skip"
        - "ai-update"      # exclusive - if both are set, neither mode runs
      sprint: "auto"

    # INCREMENTAL UPDATE (ai-update label):
    #   Surgical alternative to ai-regenerate. Only modified/new scenarios
    #   are regenerated; unchanged scenarios are preserved byte-for-byte.
    #   Requires existing JIRA markers in the feature file — first-time
    #   stories MUST go through normal mode or ai-regenerate first to
    #   establish markers. The label is consumed one-shot after success.
    update_selection:
      issue_type: "Story"
      allowed_statuses:
        - "To Do"
        - "In Progress"
        - "In Review"      # stories moved here by status_workflow after coding
      required_labels:
        - "ai-processed"
        - "human-approved"
        - "ai-update"
      excluded_labels:
        - "ai-skip"
        - "ai-regenerate"  # exclusive — only one mode per scan
      sprint: "auto"

    completion_label: "ai-coded"
    regenerate_label: "ai-regenerate"
    update_label: "ai-update"
    # Set beside ai-coded when an approved test case has no scenario of its own
    # (agents/agent2_coverage.py): the pull request and one story comment list
    # each one with its reason. Removed by the next run - ai-update after the
    # cause is fixed, or ai-regenerate - that leaves none uncovered.
    incomplete_label: "ai-incomplete"
    # CAP for automated cron scans (Day 8): same reasoning as Agent 1.
    # Each Agent 2 run on a story spends ~$0.10-0.30 in LLM tokens and
    # opens a PR. With cap=2, worst-case mislabel costs ~$0.60 and 2 PRs
    # to close — recoverable. The human-approved label gate is still the
    # primary protection; this cap is the secondary safety net.
    max_stories_per_run: 2
    # REVIEW FIX (agents/agent2_review_fix.py, agent2_review_fix.yml). A person
    # with write access submits a "Request changes" review on an auto/* pull
    # request, or comments `<command> <what to change>` on it: Agent 2 changes
    # the files the comments point at, runs the repair loop and the final
    # gate, and pushes to the SAME branch - Agents 3, 4 and 5 run again. A
    # comment that asks to test something the approved test cases do not
    # state is declined: change the test case, then add ai-regenerate.
    review_fix:
      enabled: true
      command: "/fix"          # PR comment that asks for a fix
      branch_prefix: "auto/"   # only pull requests Agent 2 opened
      max_files: 6             # more files than this in one review: ask to split it

  # Agent 0 — Impact Analyst: which existing tests does a change affect?
  #
  # Ships SWITCHED OFF. `enabled: false` makes every Agent 0 scan and the
  # workflow's analysis jobs a no-op; `shadow_mode: true` (once enabled)
  # analyses and reports only - no Impact Review, no label added (the
  # impact-check trigger is consumed), no hand-over; outcomes are still
  # measured when the pull request runs. Reconcile (C7) runs in its own job
  # whatever these say: it acts only on stories a hand-over (a person's or
  # Agent 0's) labelled impact-applied. Turn shadow mode off only after the
  # backtest and two sprints of shadow reports meet the targets (section 10).
  agent0_impact:
    # Modes: off (enabled: false), shadow (enabled + shadow_mode: true) or
    # live (enabled + shadow_mode: false).
    #   shadow: a story labelled impact-check gets a report comment; the label
    #           is removed and none is added. No sub-task, no test case changed.
    #   live:   the report plus an Impact Review sub-task; impact-check ->
    #           impact-proposed. When the review is Done, the scan hands over
    #           (Impacts links, owner comments) and labels the story ai-ready.
    # LIVE for a single-story trial (validation Phase 3). Only stories a
    # person labels impact-check are affected.
    # The framework default (core/impact_settings.DEFAULTS) stays off.
    enabled: true
    shadow_mode: false
    # A story that names an element no selector covers (E1) adds its page as a
    # review-tier candidate. Review only, never must-update. Off until the
    # backtest with and without it has been compared.
    uncovered_hint: false
    # The snapshot comes from the nightly inventory check. One older than this
    # is ignored (no hint), because the inventory may have caught up since.
    uncovered_max_age_hours: 48
    selection:
      issue_type: "Story"
      allowed_statuses: ["To Do", "In Progress", "In Review"]
      required_labels: ["impact-check"]
      excluded_labels: ["ai-skip"]
    # Label lifecycle (design section 9): a story carries at most one
    # impact- label at a time, and none once its pull request is merged.
    labels:
      check: "impact-check"
      proposed: "impact-proposed"
      applied: "impact-applied"
      reverted: "impact-reverted"
      ready: "ai-ready"
      # Not an impact- label: it stays on the nightly drift maintenance story
      # for its whole life, so the next night's drift reuses that story.
      drift: "inventory-drift"
    # The Impact Review is a standard sub-task with a Decision column; a
    # person sets the decisions and moves it to done_status.
    review:
      issue_type: "Subtask"
      summary_prefix: "Impact Review"
      done_status: "Done"
    weights: {structural: 0.45, component: 0.15, semantic: 0.15, adjudicated: 0.25}
    thresholds: {must_update: 0.6, review: 0.3}
    max_candidates: 300      # most candidates one adjudication call judges
    reconcile:
      closed_scans: 2        # closed-without-merge must be seen on this many scans
      no_pr_days: 14         # impact-applied with no PR this long -> ask a person
      # On undo: labels the closed PR made untrue, removed so a retry is just
      # "remove impact-reverted, add impact-check".
      reset_labels: ["ai-processed", "human-approved", "ai-coded", "ai-incomplete", "tests-run"]
      # A NEW story's pull request closed without merging (not a change story):
      # these come off so it is not re-coded by itself; ai-processed stays, so
      # its approved test cases are not drafted again. Retry: add human-approved.
      story_reset_labels: ["human-approved", "ai-coded", "ai-incomplete", "tests-run"]
    # Live mode: at hand-over, propose the inventory and prompts/app_context
    # changes a story implies, as a pull request (never merged by an agent;
    # merge it after deployment): wording it replaces (which can update a
    # text-based selector), and note passages it makes untrue, rewritten.
    # See core/context_update.py.
    context_update:
      enabled: true
      branch_prefix: "context-update/"   # must not contain an issue key
      # When a story's pull request merges (Story Done on merge): the facts its
      # feature adds - rules, limits, messages, flow, test data - proposed to
      # the story's Component modules as a reviewed PR; lines the notes already
      # state are dropped (core/context_update.py, propose_addition_for_story).
      additions: true
      max_addition_chars: 1500             # a longer addition is refused, not cut
      # Each prompts/app_context module goes into the prompt of every story it
      # is selected for. A module over this many characters fails the unit
      # suite (so a notes PR that grows one too far must condense it first)
      # and is reported by the onboarding check; repeated sentences are listed.
      module_budget_chars: 8000
    # Nightly drift job: the inventory changes the crawl implies, as one pull
    # request at a time for a person to merge (core/inventory_update.py): a
    # stale selector replaced when the same element is found under a new
    # selector, a stale key no code (main or an open PR) names removed,
    # uncovered live elements added with their declarations. Pages where most
    # selectors are stale are never edited (outage, redesign).
    inventory_update:
      enabled: true
      branch_prefix: "inventory-update/"   # + the date; must not contain an issue key
      max_additions_per_page: 20           # the rest are listed in the PR
      hold_ratio: 0.5                      # more than this share stale -> page left alone
      code_dirs: ["pages", "tests"]        # a key named here is never removed
      layout_min_pages: 3                  # a new element on every measured page (>= this many)
                                           # is a shared section: listed, never added per page

  # agent3_reviewer:  # triggered by GitHub PR events, no Jira selection needed
  # agent4_runner:    # triggered by GitHub PR events (CI workflow only — no .py file)
  # agent5_reporter:  # triggered after Agent 4 in same workflow