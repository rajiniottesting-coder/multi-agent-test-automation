# pytest configuration for the framework AND the generated app tests.
# Both suites run from here: tests/unit/ (offline, framework self-tests) and
# tests/step_defs/ (Playwright E2E against the app under test).

[pytest]
# Where pytest-bdd resolves the paths passed to scenarios(). Feature files are
# referenced relative to this, so scenarios("login.feature") finds
# features/login.feature.
bdd_features_base_dir = features/

# Only collect from tests/ - keeps agents/, scripts/ and pages/ out of the run.
testpaths = tests

# Files pytest treats as test modules. Generated step-def files follow this
# naming, so they are picked up automatically.
python_files = test_*.py

# -v          one line per test, so a CI log names the exact failing scenario
# --tb=short  short tracebacks; full ones bury the cause in Playwright frames
# --alluredir writes the raw results Agent 5 reads to report back to Jira
addopts = -v --tb=short --alluredir=reports/allure-results

# Put the CAPTURED LOG into junit.xml, on FAILING tests only.
#
# BasePage.is_showing() swallows the Playwright error by design and logs it at
# WARNING, so for every readiness-probe failure the traceback holds nothing but
# `assert False` and the sentence that explains it is in the captured log. With
# junit_logging unset (the default, "no") that sentence never reached junit.xml
# at all, so the Agent 4 job summary - which has only junit.xml to read - could
# not classify the failure however good the classifier got.
#
# "log" and not "all": only logging records, not stdout/stderr, which keeps the
# report small. junit_log_passing_tests=False keeps it smaller still - without
# it every one of the ~900 unit tests would carry a <system-out> block.
junit_logging = log
junit_log_passing_tests = False

# Gherkin tags become pytest markers automatically (@login -> pytest.mark.login).
# Registering one here is OPTIONAL - an unregistered tag still runs, it just
# emits PytestUnknownMarkWarning. Register a marker only when you actually want
# to filter by it, e.g. `pytest -m smoke`.
#
# NOTE: Agent 2 invents tags as it generates (it has already produced @negative
# and @validation). Chasing every new tag here is a losing game - if the
# vocabulary needs constraining, do it in prompts/agent2_coder_generate.md
# instead. `--strict-markers` is deliberately NOT set: it would turn an
# unregistered tag into a collection ERROR and break generated tests.
markers =
    smoke: quick health check - run with `pytest -m smoke`
    regression: full regression test
    login: tests for login functionality
    negative: negative-path test (invalid input, error states)
    validation: field-validation test (required, format, boundaries)